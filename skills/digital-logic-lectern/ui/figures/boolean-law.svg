<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 306" role="img" aria-label="布尔代数常用公式清单">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">布尔代数常用公式</text>
<rect x="12" y="68" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="100" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="132" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="164" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="196" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="228" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="12" y="260" width="12" height="12" rx="2" fill="#58cc02"/>
<text x="36" y="80" class="t">A + B = B + A</text>
<text x="36" y="112" class="t">A · B = B · A</text>
<text x="36" y="144" class="t">A + A = A</text>
<text x="36" y="176" class="t">A · A = A</text>
<text x="36" y="208" class="t">A + A′ = 1</text>
<text x="36" y="240" class="t">A · A′ = 0</text>
<text x="36" y="272" class="t">(A + B)′ = A′ · B′</text>
<rect x="316" y="68" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="100" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="132" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="164" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="196" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="228" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="316" y="260" width="12" height="12" rx="2" fill="#58cc02"/>
<text x="340" y="80" class="t">A + 0 = A，A · 1 = A</text>
<text x="340" y="112" class="t">A + 1 = 1，A · 0 = 0</text>
<text x="340" y="144" class="t">A + AB = A</text>
<text x="340" y="176" class="t">A + A′B = A + B</text>
<text x="340" y="208" class="t">A(B + C) = AB + AC</text>
<text x="340" y="240" class="t">A + BC = (A + B)(A + C)</text>
<text x="340" y="272" class="t">(AB)′ = A′ + B′</text>
</svg>
