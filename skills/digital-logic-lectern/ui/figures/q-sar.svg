<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="三位逐次逼近 ADC，参考电压 5 伏，输入 3.2 伏">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">题图：3 位 SAR ADC</text>
<rect x="50" y="70" width="110" height="60" rx="6" class="box"/><text x="105" y="104" class="t" text-anchor="middle">Vin = 3.2 V</text>
<rect x="210" y="70" width="100" height="60" rx="6" class="box"/><text x="260" y="104" class="t" text-anchor="middle">比较器</text>
<line x1="160" y1="100" x2="210" y2="100" class="s"/>
<line x1="310" y1="100" x2="370" y2="100" class="s"/><text x="378" y="104" class="t">3 位输出</text>
<rect x="210" y="165" width="100" height="50" rx="6" class="box"/><text x="260" y="194" class="t" text-anchor="middle">DAC</text><line x1="260" y1="165" x2="260" y2="130" class="s"/>
<text x="330" y="194" class="m">Vref = 5 V</text>
<text x="50" y="200" class="m">量化级差 = Vref / 8 = 0.625 V</text>
</svg>
