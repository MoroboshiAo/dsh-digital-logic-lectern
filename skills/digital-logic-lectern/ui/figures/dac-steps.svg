<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="三位 DAC 的八级阶梯输出，标出 1 LSB、满量程与基准电压">
<style>
	.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.g{fill:none;stroke:#3a4250;stroke-width:1.2}
	.d{fill:none;stroke:#9aa2b1;stroke-width:1.4;stroke-dasharray:5 4}
	.code{fill:#9aa2b1;font-family:Consolas,"Courier New",monospace;font-size:11px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">三位 DAC 的输出台阶</text>
<line x1="70" y1="70" x2="70" y2="266" class="g"/>
<line x1="70" y1="266" x2="520" y2="266" class="g"/>
<text x="56" y="76" class="m" text-anchor="end">Vo</text>
<text x="606" y="272" class="m">t</text>
<line x1="70" y1="90" x2="520" y2="90" class="d"/>
<text x="528" y="96" class="m">Vref：8 LSB</text>
<text x="528" y="122" class="m">满量程：7 LSB</text>
<path d="M90 266 H140 V244 H190 V222 H240 V200 H290 V178 H340 V156 H390 V134 H440 V112 H490" class="s"/>
<line x1="505" y1="244" x2="505" y2="266" class="g"/>
<line x1="500" y1="244" x2="510" y2="244" class="g"/>
<line x1="500" y1="266" x2="510" y2="266" class="g"/>
<text x="514" y="259" class="m">1 LSB</text>
<g class="code" text-anchor="middle">
	<text x="115" y="284">000</text>
	<text x="165" y="284">001</text>
	<text x="215" y="284">010</text>
	<text x="265" y="284">011</text>
	<text x="315" y="284">100</text>
	<text x="365" y="284">101</text>
	<text x="415" y="284">110</text>
	<text x="465" y="284">111</text>
</g>
<text x="320" y="316" class="m" text-anchor="middle">相邻码差 1 LSB，满量程比 Vref 少一个台阶</text>
</svg>
