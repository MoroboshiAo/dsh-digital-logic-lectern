<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="八线三线优先编码器的输入输出与优先级">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">8 线-3 线优先编码器</text>
<rect x="190" y="80" width="160" height="200" rx="8" fill="#1b2029" stroke="#58cc02" stroke-width="2"/>
<text x="270" y="170" class="t" text-anchor="middle">8 线-3 线</text>
<text x="270" y="194" class="t" text-anchor="middle">优先编码器</text>
<line x1="90" y1="94" x2="190" y2="94" class="s"/>
<line x1="90" y1="116" x2="190" y2="116" class="s"/>
<line x1="90" y1="138" x2="190" y2="138" class="s"/>
<line x1="90" y1="160" x2="190" y2="160" class="s"/>
<line x1="90" y1="182" x2="190" y2="182" class="s"/>
<line x1="90" y1="204" x2="190" y2="204" class="s"/>
<line x1="90" y1="226" x2="190" y2="226" class="s"/>
<line x1="90" y1="248" x2="190" y2="248" class="s"/>
<text x="82" y="98" class="t" text-anchor="end">I0</text>
<text x="82" y="120" class="t" text-anchor="end">I1</text>
<text x="82" y="142" class="t" text-anchor="end">I2</text>
<text x="82" y="164" class="t" text-anchor="end">I3</text>
<text x="82" y="186" class="t" text-anchor="end">I4</text>
<text x="82" y="208" class="t" text-anchor="end">I5</text>
<text x="82" y="230" class="t" text-anchor="end">I6</text>
<text x="82" y="252" class="t" text-anchor="end">I7</text>
<line x1="350" y1="130" x2="430" y2="130" class="s"/>
<line x1="350" y1="170" x2="430" y2="170" class="s"/>
<line x1="350" y1="210" x2="430" y2="210" class="s"/>
<text x="438" y="134" class="t">Y2</text>
<text x="438" y="174" class="t">Y1</text>
<text x="438" y="214" class="t">Y0</text>
<text x="60" y="312" class="m">高编号输入优先：I7 有效时输出 111，I6 有效时为 110</text>
</svg>
