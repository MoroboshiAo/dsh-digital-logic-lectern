<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="与非门构成的基本 SR 锁存器及功能表">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">基本 SR 锁存器</text>
<path d="M90 60 h30 a30 30 0 0 1 0 60 h-30 z" class="box"/>
<path d="M210 140 h-30 a30 30 0 0 0 0 60 h30 z" class="box"/>
<circle cx="154" cy="90" r="4" class="s"/><circle cx="146" cy="170" r="4" class="s"/>
<text x="62" y="79" class="t">S̄</text><line x1="70" y1="75" x2="90" y2="75" class="s"/>
<text x="228" y="189" class="t">R̄</text><line x1="220" y1="185" x2="210" y2="185" class="s"/>
<line x1="158" y1="90" x2="280" y2="90" class="s"/><text x="286" y="94" class="t">Q</text>
<line x1="250" y1="90" x2="250" y2="155" class="s"/><line x1="250" y1="155" x2="210" y2="155" class="s"/>
<circle cx="250" cy="90" r="3" fill="#58cc02"/>
<line x1="142" y1="170" x2="60" y2="170" class="s"/><text x="34" y="174" class="t">Q̄</text>
<line x1="70" y1="170" x2="70" y2="105" class="s"/><line x1="70" y1="105" x2="90" y2="105" class="s"/>
<circle cx="70" cy="170" r="3" fill="#58cc02"/>
<line x1="300" y1="62" x2="300" y2="240" class="g"/>
<text x="330" y="74" class="b">功能表</text>
<rect x="330" y="88" width="270" height="130" rx="0" class="g"/>
<line x1="330" y1="118" x2="600" y2="118" class="g"/><line x1="330" y1="148" x2="600" y2="148" class="g"/><line x1="330" y1="178" x2="600" y2="178" class="g"/>
<line x1="420" y1="88" x2="420" y2="218" class="g"/><line x1="500" y1="88" x2="500" y2="218" class="g"/>
<text x="375" y="108" class="t" text-anchor="middle">S̄ R̄</text><text x="460" y="108" class="t" text-anchor="middle">Q</text><text x="550" y="108" class="t" text-anchor="middle">说明</text>
<text x="375" y="138" class="t" text-anchor="middle">1 0</text><text x="460" y="138" class="t" text-anchor="middle">1</text><text x="550" y="138" class="t" text-anchor="middle">置 1</text>
<text x="375" y="168" class="t" text-anchor="middle">0 1</text><text x="460" y="168" class="t" text-anchor="middle">0</text><text x="550" y="168" class="t" text-anchor="middle">置 0</text>
<text x="375" y="198" class="t" text-anchor="middle">1 1</text><text x="460" y="198" class="t" text-anchor="middle">保持</text><text x="550" y="198" class="t" text-anchor="middle">保持</text>
<text x="375" y="232" class="t" text-anchor="middle">0 0</text><text x="460" y="232" class="t" text-anchor="middle">不定</text><text x="550" y="232" class="t" text-anchor="middle">禁止</text>
</svg>
