<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" role="img" aria-label="四位二进制计数器，时钟输入，输出为 Q3 到 Q0，初态全零">
	<g fill="#1c1f26" stroke="#58cc02" stroke-width="2.2">
		<rect x="110" y="50" width="180" height="110" rx="10"/>
	</g>
	<g fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round">
		<path d="M50 86h60M50 126h60"/>
		<path d="M290 70h70M290 94h70M290 118h70M290 142h70"/>
		<path d="M122 150l12 9-12 9"/>
	</g>
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#9aa2b1" font-size="12">
		<text x="26" y="90">CLK</text>
		<text x="26" y="130">CLR</text>
		<text x="366" y="74">Q3</text>
		<text x="366" y="98">Q2</text>
		<text x="366" y="122">Q1</text>
		<text x="366" y="146">Q0</text>
	</g>
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
		<text x="200" y="92" fill="#e6e8ee" font-size="14" font-weight="600">4 位二进制</text>
		<text x="200" y="114" fill="#e6e8ee" font-size="14" font-weight="600">计数器</text>
		<text x="200" y="136" fill="#9aa2b1" font-size="11">初态 0000</text>
	</g>
</svg>
