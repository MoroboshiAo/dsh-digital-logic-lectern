<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="ROM 的地址译码器与存储阵列">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">ROM 的存储阵列</text>
<rect x="24" y="64" width="84" height="156" rx="7" class="box"/>
<text x="66" y="134" class="t" text-anchor="middle">地址</text>
<text x="66" y="156" class="t" text-anchor="middle">译码</text>
<line x1="108" y1="84" x2="540" y2="84" class="s"/>
<line x1="108" y1="124" x2="540" y2="124" class="s"/>
<line x1="108" y1="164" x2="540" y2="164" class="s"/>
<line x1="108" y1="204" x2="540" y2="204" class="s"/>
<line x1="200" y1="64" x2="200" y2="224" class="g"/>
<line x1="300" y1="64" x2="300" y2="224" class="g"/>
<line x1="400" y1="64" x2="400" y2="224" class="g"/>
<line x1="500" y1="64" x2="500" y2="224" class="g"/>
<circle cx="200" cy="84" r="3.5" fill="#3a4250"/><circle cx="300" cy="84" r="3.5" fill="#3a4250"/><circle cx="400" cy="84" r="3.5" fill="#3a4250"/><circle cx="500" cy="84" r="3.5" fill="#3a4250"/>
<circle cx="200" cy="124" r="3.5" fill="#3a4250"/><circle cx="300" cy="124" r="3.5" fill="#3a4250"/><circle cx="400" cy="124" r="3.5" fill="#3a4250"/><circle cx="500" cy="124" r="3.5" fill="#3a4250"/>
<circle cx="200" cy="164" r="5" fill="#58cc02"/><circle cx="300" cy="164" r="5" fill="#58cc02"/><circle cx="400" cy="164" r="5" fill="#58cc02"/><circle cx="500" cy="164" r="5" fill="#58cc02"/>
<circle cx="200" cy="204" r="3.5" fill="#3a4250"/><circle cx="300" cy="204" r="3.5" fill="#3a4250"/><circle cx="400" cy="204" r="3.5" fill="#3a4250"/><circle cx="500" cy="204" r="3.5" fill="#3a4250"/>
<text x="200" y="56" class="m" text-anchor="middle">D3</text>
<text x="300" y="56" class="m" text-anchor="middle">D2</text>
<text x="400" y="56" class="m" text-anchor="middle">D1</text>
<text x="500" y="56" class="m" text-anchor="middle">D0</text>
<text x="552" y="88" class="m">W0</text>
<text x="552" y="128" class="m">W1</text>
<text x="552" y="168" class="m">W2</text>
<text x="552" y="208" class="m">W3</text>
<text x="24" y="264" class="m">选中的字线整行有效，各位线上的数据同时送出</text>
</svg>
