<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-label="四位数值比较器的两组数据输入与三种比较结果">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">4 位数值比较器</text>
<rect x="200" y="70" width="240" height="190" rx="8" fill="#1b2029" stroke="#58cc02" stroke-width="2"/>
<text x="320" y="146" class="t" text-anchor="middle">4 位数值比较器</text>
<text x="320" y="170" class="m" text-anchor="middle">74LS85</text>
<line x1="130" y1="84" x2="200" y2="84" class="s"/>
<line x1="130" y1="104" x2="200" y2="104" class="s"/>
<line x1="130" y1="124" x2="200" y2="124" class="s"/>
<line x1="130" y1="144" x2="200" y2="144" class="s"/>
<line x1="130" y1="170" x2="200" y2="170" class="s"/>
<line x1="130" y1="190" x2="200" y2="190" class="s"/>
<line x1="130" y1="210" x2="200" y2="210" class="s"/>
<line x1="130" y1="230" x2="200" y2="230" class="s"/>
<text x="122" y="88" class="t" text-anchor="end">A3</text>
<text x="122" y="108" class="t" text-anchor="end">A2</text>
<text x="122" y="128" class="t" text-anchor="end">A1</text>
<text x="122" y="148" class="t" text-anchor="end">A0</text>
<text x="122" y="174" class="t" text-anchor="end">B3</text>
<text x="122" y="194" class="t" text-anchor="end">B2</text>
<text x="122" y="214" class="t" text-anchor="end">B1</text>
<text x="122" y="234" class="t" text-anchor="end">B0</text>
<line x1="440" y1="100" x2="510" y2="100" class="s"/>
<line x1="440" y1="160" x2="510" y2="160" class="s"/>
<line x1="440" y1="220" x2="510" y2="220" class="s"/>
<text x="518" y="104" class="t">A &gt; B</text>
<text x="518" y="164" class="t">A = B</text>
<text x="518" y="224" class="t">A &lt; B</text>
<text x="200" y="300" class="m">先比高位：高位不等即可定结果，相等时再比低位</text>
</svg>
