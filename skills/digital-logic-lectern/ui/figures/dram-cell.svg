<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="单管 DRAM 存储元与周期刷新">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">1T1C 存储元</text>
<line x1="90" y1="55" x2="90" y2="200" class="s"/><text x="66" y="48" class="t">BL</text>
<line x1="90" y1="80" x2="190" y2="80" class="s"/><text x="124" y="72" class="m">WL</text>
<rect x="190" y="62" width="34" height="36" class="box"/><text x="207" y="86" class="m" text-anchor="middle">M</text>
<line x1="224" y1="80" x2="270" y2="80" class="s"/>
<line x1="270" y1="70" x2="270" y2="90" class="s"/><line x1="286" y1="70" x2="286" y2="90" class="s"/><line x1="270" y1="90" x2="286" y2="90" class="s"/>
<text x="296" y="84" class="m">C</text>
<line x1="278" y1="90" x2="278" y2="130" class="s"/><line x1="262" y1="130" x2="294" y2="130" class="s"/>
<text x="196" y="118" class="m">电荷表示 1/0</text>
<line x1="300" y1="62" x2="300" y2="225" class="g"/>
<text x="330" y="74" class="b">刷新</text>
<text x="330" y="104" class="m">电容电荷会泄漏</text>
<text x="330" y="132" class="m">按行读出并原样写回</text>
<text x="330" y="160" class="m">刷新期间数据不变</text>
<text x="330" y="196" class="m">结构简单、集成度高，但需刷新电路</text>
</svg>
