<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="CPLD 与 FPGA 在逻辑粒度、互连、配置和规模上的对比">
<style>
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13.5px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.g{fill:none;stroke:#3a4250;stroke-width:1.2}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">CPLD 与 FPGA 的对比</text>
<text x="330" y="74" class="b" text-anchor="middle">CPLD</text>
<text x="520" y="74" class="b" text-anchor="middle">FPGA</text>
<line x1="24" y1="86" x2="616" y2="86" class="g"/>
<line x1="24" y1="130" x2="616" y2="130" class="g"/>
<line x1="24" y1="170" x2="616" y2="170" class="g"/>
<line x1="24" y1="210" x2="616" y2="210" class="g"/>
<line x1="250" y1="60" x2="250" y2="250" class="g"/>
<line x1="430" y1="60" x2="430" y2="250" class="g"/>
<text x="30" y="118" class="m">逻辑粒度</text>
<text x="330" y="118" class="t" text-anchor="middle">与或阵列，粗</text>
<text x="520" y="118" class="t" text-anchor="middle">查找表，细</text>
<text x="30" y="158" class="m">互连方式</text>
<text x="330" y="158" class="t" text-anchor="middle">集中式，延迟固定</text>
<text x="520" y="158" class="t" text-anchor="middle">分布式，随布局变化</text>
<text x="30" y="198" class="m">配置工艺</text>
<text x="330" y="198" class="t" text-anchor="middle">E2CMOS，掉电保持</text>
<text x="520" y="198" class="t" text-anchor="middle">SRAM，上电装入</text>
<text x="30" y="238" class="m">典型规模</text>
<text x="330" y="238" class="t" text-anchor="middle">数千门</text>
<text x="520" y="238" class="t" text-anchor="middle">数万至数百万门</text>
</svg>
