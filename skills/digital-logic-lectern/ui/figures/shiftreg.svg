<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="四位右移寄存器的串行输入与并行输出">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">四位右移寄存器</text>
<line x1="30" y1="100" x2="70" y2="100" class="s"/><text x="24" y="86" class="t">D_in</text>
<rect x="70" y="80" width="90" height="60" rx="6" class="box"/><text x="115" y="116" class="t" text-anchor="middle">D3</text><rect x="190" y="80" width="90" height="60" rx="6" class="box"/><text x="235" y="116" class="t" text-anchor="middle">D2</text><rect x="310" y="80" width="90" height="60" rx="6" class="box"/><text x="355" y="116" class="t" text-anchor="middle">D1</text><rect x="430" y="80" width="90" height="60" rx="6" class="box"/><text x="475" y="116" class="t" text-anchor="middle">D0</text>
<line x1="160" y1="110" x2="190" y2="110" class="s"/><path d="M190 110 l-6 -3 v6 z" fill="#58cc02"/><line x1="280" y1="110" x2="310" y2="110" class="s"/><path d="M310 110 l-6 -3 v6 z" fill="#58cc02"/><line x1="400" y1="110" x2="430" y2="110" class="s"/><path d="M430 110 l-6 -3 v6 z" fill="#58cc02"/>
<line x1="550" y1="110" x2="590" y2="110" class="s"/><path d="M590 110 l-6 -3 v6 z" fill="#58cc02"/><text x="596" y="114" class="t">D_out</text>
<line x1="50" y1="170" x2="600" y2="170" class="s"/><text x="50" y="196" class="m">CLK</text>
<line x1="115" y1="140" x2="115" y2="170" class="s"/><line x1="235" y1="140" x2="235" y2="170" class="s"/><line x1="355" y1="140" x2="355" y2="170" class="s"/><line x1="475" y1="140" x2="475" y2="170" class="s"/>
<line x1="115" y1="80" x2="115" y2="62" class="s"/><text x="112" y="52" class="m">Q3</text><line x1="235" y1="80" x2="235" y2="62" class="s"/><text x="232" y="52" class="m">Q2</text><line x1="355" y1="80" x2="355" y2="62" class="s"/><text x="352" y="52" class="m">Q1</text><line x1="475" y1="80" x2="475" y2="62" class="s"/><text x="472" y="52" class="m">Q0</text>
<text x="70" y="224" class="m">每个时钟沿右移一位，串行输入进入最高位</text>
</svg>
