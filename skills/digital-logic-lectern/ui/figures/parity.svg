<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="偶校验与奇校验的校验位取值">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">奇偶校验</text>
<text x="40" y="70" class="m">数据位 1011 中 1 的个数为 3</text>
<rect x="40" y="90" width="260" height="46" rx="6" class="box"/><text x="170" y="118" class="b" text-anchor="middle">1  0  1  1</text>
<rect x="316" y="90" width="120" height="46" rx="6" class="box"/><text x="376" y="118" class="b" text-anchor="middle">偶校验位 1</text>
<rect x="452" y="90" width="120" height="46" rx="6" class="box"/><text x="512" y="118" class="b" text-anchor="middle">奇校验位 0</text>
<text x="40" y="168" class="m">偶校验：补 1 后 1 的总数为偶数</text>
<text x="40" y="194" class="m">奇校验：补 1 后 1 的总数为奇数</text>
<line x1="300" y1="62" x2="300" y2="210" class="g"/>
<text x="330" y="74" class="b">接收端</text>
<text x="330" y="104" class="m">统计 1 的个数并核对奇偶</text>
<text x="330" y="132" class="m">偶数个 1 错位时无法检出</text>
<text x="330" y="176" class="m">只能检错，不能纠错</text>
</svg>
