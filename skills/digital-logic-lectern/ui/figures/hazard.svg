<path d="M80 80 h80 v40 h80 v-40 h80 v40 h80 v-40 h80 v40 h80" class="s"/>
<path d="M80 130 v40 h80 v-40 h80 v40 h80 v-40 h80 v40 h80 v-40 h80" class="s" opacity="0.75"/>
<line x1="80" y1="175" x2="600" y2="175" class="s"/>
<path d="M80 175 h100 v-22 h8 v22 h100 v-22 h8 v22 h100 v-22 h8 v22 h100 v-22 h8 v22 h96" class="s"/>
<line x1="180" y1="140" x2="188" y2="200" class="hl"/>
<text x="196" y="214" class="m">窄脉冲</text>
<text x="410" y="40" class="m">理想 F = A + A′ = 1</text>
