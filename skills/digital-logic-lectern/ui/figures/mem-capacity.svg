<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="1K 乘 4 存储器的十条地址线、四条数据线和片选读写控制线">
<style>
	.s{fill:none;stroke:#58cc02;stroke-width:2.5;stroke-linecap:round}
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.g{fill:none;stroke:#3a4250;stroke-width:1.2}
	.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">1K × 4 存储器的引脚分配</text>
<line x1="150" y1="120" x2="250" y2="120" class="s"/>
<line x1="450" y1="120" x2="550" y2="120" class="s"/>
<text x="240" y="106" class="m" text-anchor="end">地址线 A0–A9</text>
<text x="240" y="146" class="m" text-anchor="end">10 条 → 1024 字</text>
<text x="460" y="106" class="m">数据线 D0–D3</text>
<text x="460" y="146" class="m">4 条 → 每字 4 位</text>
<rect x="250" y="76" width="200" height="132" rx="6" class="box"/>
<text x="350" y="126" class="b" font-size="17" text-anchor="middle">1K × 4</text>
<text x="350" y="154" class="m" text-anchor="middle">1024 字 × 4 位</text>
<line x1="290" y1="208" x2="290" y2="228" class="s"/>
<line x1="400" y1="208" x2="400" y2="228" class="s"/>
<text x="290" y="248" class="m" text-anchor="middle">CS 片选</text>
<text x="400" y="248" class="m" text-anchor="middle">WE 读写</text>
<text x="320" y="282" class="m" text-anchor="middle">容量 = 字数 × 字长，字数定地址线，字长定数据线</text>
</svg>
