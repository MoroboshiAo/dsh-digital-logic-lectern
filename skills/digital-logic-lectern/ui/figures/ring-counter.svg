<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="环形计数器直接反馈与扭环计数器取反反馈的接法">
<style>
	.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.g{fill:none;stroke:#3a4250;stroke-width:1.2}
	.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="32" y="48" class="b">环形计数器</text>
<text x="500" y="48" class="m" text-anchor="middle">模 k = 4</text>
<rect x="90" y="66" width="64" height="44" rx="5" class="box"/><text x="122" y="94" class="t" text-anchor="middle">D1</text>
<rect x="170" y="66" width="64" height="44" rx="5" class="box"/><text x="202" y="94" class="t" text-anchor="middle">D2</text>
<rect x="250" y="66" width="64" height="44" rx="5" class="box"/><text x="282" y="94" class="t" text-anchor="middle">D3</text>
<rect x="330" y="66" width="64" height="44" rx="5" class="box"/><text x="362" y="94" class="t" text-anchor="middle">D4</text>
<g class="s">
	<line x1="58" y1="88" x2="90" y2="88"/>
	<line x1="154" y1="88" x2="170" y2="88"/>
	<line x1="234" y1="88" x2="250" y2="88"/>
	<line x1="314" y1="88" x2="330" y2="88"/>
	<line x1="394" y1="88" x2="424" y2="88"/>
	<line x1="424" y1="88" x2="424" y2="134"/>
	<line x1="424" y1="134" x2="58" y2="134"/>
	<line x1="58" y1="134" x2="58" y2="88"/>
</g>
<text x="240" y="156" class="m" text-anchor="middle">末级直接接回第一级</text>
<text x="32" y="196" class="b">扭环计数器</text>
<text x="500" y="196" class="m" text-anchor="middle">模 2k = 8</text>
<rect x="90" y="214" width="64" height="44" rx="5" class="box"/><text x="122" y="242" class="t" text-anchor="middle">D1</text>
<rect x="170" y="214" width="64" height="44" rx="5" class="box"/><text x="202" y="242" class="t" text-anchor="middle">D2</text>
<rect x="250" y="214" width="64" height="44" rx="5" class="box"/><text x="282" y="242" class="t" text-anchor="middle">D3</text>
<rect x="330" y="214" width="64" height="44" rx="5" class="box"/><text x="362" y="242" class="t" text-anchor="middle">D4</text>
<g class="s">
	<line x1="58" y1="236" x2="90" y2="236"/>
	<line x1="154" y1="236" x2="170" y2="236"/>
	<line x1="234" y1="236" x2="250" y2="236"/>
	<line x1="314" y1="236" x2="330" y2="236"/>
	<line x1="394" y1="236" x2="424" y2="236"/>
	<line x1="424" y1="236" x2="424" y2="282"/>
	<line x1="424" y1="282" x2="58" y2="282"/>
	<line x1="58" y1="282" x2="58" y2="274"/>
	<line x1="58" y1="256" x2="58" y2="236"/>
</g>
<polygon points="52,274 64,274 58,263" fill="#1b2029" stroke="#3a4250" stroke-width="1.4"/>
<circle cx="58" cy="259" r="3" fill="#141821" stroke="#3a4250" stroke-width="1.4"/>
<text x="240" y="304" class="m" text-anchor="middle">末级取反后接回第一级</text>
</svg>
