<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="熔丝、反熔丝、E2CMOS 与 SRAM 四种可编程连接技术的编程方式和掉电特性">
<style>
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">四种可编程连接技术</text>
<rect x="16" y="50" width="140" height="200" rx="8" class="box"/>
<text x="86" y="80" class="b" text-anchor="middle">熔丝</text>
<text x="34" y="118" class="t">编程：烧断</text>
<text x="34" y="150" class="t">次数：一次</text>
<text x="34" y="182" class="t">掉电：保持</text>
<text x="34" y="214" class="t">状态：断为 0</text>
<rect x="172" y="50" width="140" height="200" rx="8" class="box"/>
<text x="242" y="80" class="b" text-anchor="middle">反熔丝</text>
<text x="190" y="118" class="t">编程：击穿</text>
<text x="190" y="150" class="t">次数：一次</text>
<text x="190" y="182" class="t">掉电：保持</text>
<text x="190" y="214" class="t">状态：通为 1</text>
<rect x="328" y="50" width="140" height="200" rx="8" class="box"/>
<text x="398" y="80" class="b" text-anchor="middle">E2CMOS</text>
<text x="346" y="118" class="t">编程：浮栅电荷</text>
<text x="346" y="150" class="t">次数：可擦写</text>
<text x="346" y="182" class="t">掉电：保持</text>
<text x="346" y="214" class="t">擦除：电擦除</text>
<rect x="484" y="50" width="140" height="200" rx="8" class="box"/>
<text x="554" y="80" class="b" text-anchor="middle">SRAM</text>
<text x="502" y="118" class="t">编程：改写存储元</text>
<text x="502" y="150" class="t">次数：可反复</text>
<text x="502" y="182" class="t">掉电：丢失</text>
<text x="502" y="214" class="t">上电：重新装入</text>
<text x="320" y="280" class="m" text-anchor="middle">熔丝与反熔丝只能编程一次，E2CMOS 与 SRAM 可反复配置</text>
</svg>
