<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="周期为 8 毫秒、脉宽为 2 毫秒的矩形脉冲">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 4}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">题图：矩形脉冲</text>
<text x="24" y="96" class="m">高</text>
<text x="24" y="204" class="m">低</text>
<line x1="80" y1="200" x2="80" y2="100" class="s"/>
<line x1="80" y1="100" x2="130" y2="100" class="s"/>
<line x1="130" y1="100" x2="130" y2="200" class="s"/>
<line x1="130" y1="200" x2="280" y2="200" class="s"/>
<line x1="280" y1="200" x2="280" y2="100" class="s"/>
<line x1="280" y1="100" x2="330" y2="100" class="s"/>
<line x1="330" y1="100" x2="330" y2="200" class="s"/>
<line x1="330" y1="200" x2="480" y2="200" class="s"/>
<line x1="80" y1="222" x2="130" y2="222" class="d"/>
<line x1="80" y1="216" x2="80" y2="228" class="d"/>
<line x1="130" y1="216" x2="130" y2="228" class="d"/>
<text x="105" y="244" class="m" text-anchor="middle">t_w = 2 ms</text>
<line x1="80" y1="272" x2="280" y2="272" class="d"/>
<line x1="80" y1="266" x2="80" y2="278" class="d"/>
<line x1="280" y1="266" x2="280" y2="278" class="d"/>
<text x="180" y="294" class="m" text-anchor="middle">T = 8 ms</text>
</svg>
