<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" role="img" aria-label="R-2R 梯形网络数模转换器">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">R-2R 梯形 DAC</text>
<text x="40" y="86" class="t">b3</text><text x="40" y="126" class="t">b2</text><text x="40" y="166" class="t">b1</text><text x="40" y="206" class="t">b0</text>
<line x1="60" y1="82" x2="110" y2="82" class="s"/><line x1="60" y1="122" x2="110" y2="122" class="s"/><line x1="60" y1="162" x2="110" y2="162" class="s"/><line x1="60" y1="202" x2="110" y2="202" class="s"/>
<rect x="110" y="60" width="120" height="160" rx="6" class="box"/><text x="170" y="130" class="t" text-anchor="middle">R-2R</text><text x="170" y="152" class="m" text-anchor="middle">网络</text>
<text x="80" y="70" class="m">开关</text><text x="80" y="110" class="m">开关</text><text x="80" y="150" class="m">开关</text><text x="80" y="190" class="m">开关</text>
<line x1="230" y1="140" x2="300" y2="140" class="s"/><path d="M300 100 l60 40 l-60 40 z" class="box"/>
<text x="316" y="132" class="t">−</text><text x="316" y="160" class="t">+</text>
<line x1="360" y1="140" x2="400" y2="140" class="s"/><text x="408" y="144" class="t">Vo</text>
<text x="300" y="216" class="m">Vo 与输入数字量成正比</text>
<line x1="470" y1="60" x2="470" y2="220" class="g"/>
<text x="498" y="74" class="b">特点</text>
<text x="498" y="104" class="m">只用 R 和 2R 两种阻值</text>
<text x="498" y="132" class="m">阻值匹配容易，便于集成</text>
<text x="498" y="160" class="m">位数越多输出台阶越细</text>
<text x="498" y="196" class="m">开关压降与电阻失配带来误差</text>
</svg>
