<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="矩形脉冲的上升时间、下降时间、脉宽、周期与占空比">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 4}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">矩形脉冲的参数</text>
<text x="24" y="96" class="m">高电平</text>
<text x="24" y="204" class="m">低电平</text>
<line x1="90" y1="200" x2="110" y2="100" class="s"/>
<line x1="110" y1="100" x2="250" y2="100" class="s"/>
<line x1="250" y1="100" x2="272" y2="200" class="s"/>
<line x1="272" y1="200" x2="350" y2="200" class="s"/>
<line x1="350" y1="200" x2="370" y2="100" class="s"/>
<line x1="370" y1="100" x2="450" y2="100" class="s"/>
<text x="92" y="86" class="m">t_r</text>
<text x="172" y="86" class="m">t_w</text>
<text x="254" y="86" class="m">t_f</text>
<line x1="90" y1="240" x2="90" y2="252" class="d"/>
<line x1="350" y1="240" x2="350" y2="252" class="d"/>
<line x1="90" y1="246" x2="350" y2="246" class="d"/>
<text x="220" y="272" class="m" text-anchor="middle">T（周期）</text>
<text x="420" y="272" class="m">占空比 = t_w / T</text>
</svg>
