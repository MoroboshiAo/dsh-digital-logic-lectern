<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="存储器的位扩展与字扩展接线方式">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#58cc02"/></marker></defs>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">存储器容量扩充</text>
<text x="24" y="62" class="m">位扩展：1K×4 → 1K×8</text>
<rect x="24" y="76" width="120" height="48" rx="6" class="box"/>
<text x="84" y="105" class="t" text-anchor="middle">1K×4</text>
<rect x="24" y="138" width="120" height="48" rx="6" class="box"/>
<text x="84" y="167" class="t" text-anchor="middle">1K×4</text>
<line x1="144" y1="100" x2="210" y2="100" class="s"/>
<text x="218" y="105" class="t">D7～D4</text>
<line x1="144" y1="162" x2="210" y2="162" class="s"/>
<text x="218" y="167" class="t">D3～D0</text>
<text x="24" y="228" class="m">地址线与读写线全部并联</text>
<line x1="330" y1="52" x2="330" y2="266" class="g"/>
<text x="356" y="62" class="m">字扩展：1K×8 → 2K×8</text>
<rect x="354" y="76" width="76" height="110" rx="6" class="box"/>
<text x="392" y="122" class="t" text-anchor="middle">1-2</text>
<text x="392" y="144" class="t" text-anchor="middle">译码</text>
<line x1="430" y1="100" x2="470" y2="100" class="s"/>
<line x1="430" y1="162" x2="470" y2="162" class="s"/>
<rect x="470" y="76" width="140" height="48" rx="6" class="box"/>
<text x="540" y="105" class="t" text-anchor="middle">1K×8</text>
<rect x="470" y="138" width="140" height="48" rx="6" class="box"/>
<text x="540" y="167" class="t" text-anchor="middle">1K×8</text>
<text x="356" y="228" class="m">高位地址经译码产生片选</text>
</svg>
