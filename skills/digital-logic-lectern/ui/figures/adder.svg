<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="半加器与全加器的输入输出及方程">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">半加器与全加器</text>
<text x="30" y="66" class="m">半加器</text>
<rect x="40" y="80" width="110" height="80" rx="6" class="box"/><text x="95" y="115" class="t" text-anchor="middle">HA</text><text x="95" y="138" class="m" text-anchor="middle">S = A⊕B</text>
<text x="18" y="104" class="t">A</text><text x="18" y="140" class="t">B</text><line x1="28" y1="100" x2="40" y2="100" class="s"/><line x1="28" y1="136" x2="40" y2="136" class="s"/>
<line x1="150" y1="100" x2="178" y2="100" class="s"/><text x="184" y="104" class="t">S</text>
<line x1="150" y1="140" x2="178" y2="140" class="s"/><text x="184" y="144" class="t">C = AB</text>
<text x="30" y="200" class="m">全加器</text>
<rect x="40" y="214" width="130" height="40" rx="6" class="box"/><text x="105" y="239" class="t" text-anchor="middle">FA</text>
<text x="18" y="226" class="t">A</text><text x="18" y="248" class="t">B</text><text x="140" y="208" class="t">Cin</text>
<line x1="28" y1="222" x2="40" y2="222" class="s"/><line x1="28" y1="244" x2="40" y2="244" class="s"/><line x1="105" y1="204" x2="105" y2="214" class="s"/>
<line x1="170" y1="226" x2="198" y2="226" class="s"/><text x="204" y="230" class="t">S</text>
<line x1="170" y1="246" x2="198" y2="246" class="s"/><text x="204" y="250" class="t">Cout</text>
<line x1="300" y1="62" x2="300" y2="256" class="g"/>
<text x="330" y="74" class="b">全加器方程</text>
<text x="330" y="104" class="t">S = A ⊕ B ⊕ Cin</text>
<text x="330" y="134" class="t">Cout = AB + Cin(A ⊕ B)</text>
<text x="330" y="174" class="m">进位传递：Cin 经 A⊕B 传到 Cout</text>
<text x="330" y="200" class="m">多位加法器由此串接或超前进位</text>
</svg>
