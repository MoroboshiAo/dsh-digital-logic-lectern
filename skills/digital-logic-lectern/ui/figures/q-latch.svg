<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="门控 D 锁存器在 CP 为 1、D 为 0 时的工作状态">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">题图：门控 D 锁存器</text>
<rect x="150" y="60" width="180" height="100" rx="6" class="box"/><text x="240" y="110" class="t" text-anchor="middle">D 锁存器</text>
<text x="84" y="90" class="t">D = 0</text><line x1="132" y1="86" x2="150" y2="86" class="s"/>
<text x="180" y="190" class="t">CP = 1</text><line x1="240" y1="186" x2="240" y2="160" class="s"/>
<line x1="330" y1="110" x2="390" y2="110" class="s"/><text x="398" y="114" class="t">Q</text>
<text x="408" y="90" class="m">CP 有效期间输出跟随 D</text>
</svg>
