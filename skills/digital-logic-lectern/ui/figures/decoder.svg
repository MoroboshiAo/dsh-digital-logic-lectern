<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="三线八线译码器的输入输出关系">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">3-8 译码器</text>
<rect x="120" y="55" width="150" height="190" rx="6" class="box"/>
<text x="132" y="90" class="t">A2</text><text x="132" y="125" class="t">A1</text><text x="132" y="160" class="t">A0</text>
<text x="150" y="90" class="t">101</text>
<line x1="115" y1="84" x2="120" y2="84" class="s"/><line x1="115" y1="119" x2="120" y2="119" class="s"/><line x1="115" y1="154" x2="120" y2="154" class="s"/>
<text x="300" y="76" class="t">Y0</text><text x="300" y="98" class="t">Y1</text><text x="300" y="120" class="t">Y2</text><text x="300" y="142" class="t">Y3</text><text x="300" y="164" class="t">Y4</text><text x="300" y="186" class="t">Y5</text><text x="300" y="208" class="t">Y6</text><text x="300" y="230" class="t">Y7</text>
<line x1="270" y1="71" x2="294" y2="71" class="s"/><line x1="270" y1="93" x2="294" y2="93" class="s"/><line x1="270" y1="115" x2="294" y2="115" class="s"/><line x1="270" y1="137" x2="294" y2="137" class="s"/><line x1="270" y1="159" x2="294" y2="159" class="s"/><line x1="270" y1="181" x2="294" y2="181" class="s"/><line x1="270" y1="203" x2="294" y2="203" class="s"/><line x1="270" y1="225" x2="294" y2="225" class="s"/>
<rect x="286" y="171" width="60" height="24" rx="4" class="hl"/>
<text x="390" y="90" class="m">输入 A2A1A0 = 101</text>
<text x="390" y="118" class="m">只有 Y5 有效</text>
<text x="390" y="146" class="m">低电平有效时 Y5 = 0</text>
<text x="390" y="174" class="m">其余输出为 1</text>
</svg>
