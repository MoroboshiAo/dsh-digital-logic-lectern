<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="阻塞赋值与非阻塞赋值在同一时钟沿下两级寄存器输出的时序差别">
<style>
	.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
	.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
	.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
	.g{fill:none;stroke:#3a4250;stroke-width:1.2}
	.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">阻塞与非阻塞赋值的时序差别</text>
<line x1="200" y1="52" x2="200" y2="240" class="d"/>
<line x1="320" y1="52" x2="320" y2="240" class="d"/>
<line x1="440" y1="52" x2="440" y2="240" class="d"/>
<text x="110" y="76" class="m" text-anchor="end">CLK</text>
<text x="110" y="114" class="m" text-anchor="end">D</text>
<text x="110" y="152" class="m" text-anchor="end">Q1（非阻塞）</text>
<text x="110" y="190" class="m" text-anchor="end">Q2（非阻塞）</text>
<text x="110" y="228" class="m" text-anchor="end">Q2（阻塞）</text>
<path d="M120 84 H200 V56 H260 V84 H320 V56 H380 V84 H440 V56 H500 V84 H600" class="s"/>
<path d="M120 122 H200 V94 H320 V122 H440 V94 H600" class="s"/>
<path d="M120 160 H200 V132 H320 V160 H440 V132 H600" class="s"/>
<path d="M120 160 H320 V132 H440 V160 H600" class="s"/>
<path d="M120 160 H200 V132 H320 V160 H440 V132 H600" class="s"/>
<text x="320" y="272" class="m" text-anchor="middle">同一沿上，阻塞赋值让 Q2 取到新值，非阻塞取旧值</text>
<text x="320" y="292" class="m" text-anchor="middle">Q2 比非阻塞的 Q1 滞后一个时钟周期</text>
</svg>
