<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="三态门与总线连接方式">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">三态门与总线</text>
<line x1="50" y1="90" x2="90" y2="90" class="s"/><line x1="50" y1="140" x2="90" y2="140" class="s"/>
<path d="M90 70 l70 45 l-70 45 z" class="box"/>
<text x="30" y="94" class="t">A</text><text x="30" y="144" class="t">EN</text>
<line x1="160" y1="115" x2="210" y2="115" class="s"/><text x="216" y="119" class="t">F</text>
<text x="48" y="188" class="m">EN = 1 时 F = A；EN = 0 时 F = 高阻</text>
<line x1="300" y1="62" x2="300" y2="200" class="g"/>
<text x="330" y="72" class="b">多个三态门挂同一组总线</text>
<line x1="340" y1="110" x2="600" y2="110" class="s"/><line x1="340" y1="150" x2="600" y2="150" class="s"/>
<rect x="350" y="90" width="55" height="30" rx="6" class="box"/><text x="377" y="110" class="t" text-anchor="middle">门1</text>
<rect x="430" y="90" width="55" height="30" rx="6" class="box"/><text x="457" y="110" class="t" text-anchor="middle">门2</text>
<rect x="510" y="90" width="55" height="30" rx="6" class="box"/><text x="537" y="110" class="t" text-anchor="middle">门3</text>
<text x="470" y="140" class="m" text-anchor="middle">总线</text>
<text x="470" y="180" class="m" text-anchor="middle">任一时刻只允许一个门驱动</text>
</svg>
