<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="全加器输入 A 为 1、B 为 1、Cin 为 0">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">题图：全加器</text>
<rect x="160" y="60" width="180" height="100" rx="6" class="box"/><text x="250" y="105" class="t" text-anchor="middle">FA</text>
<text x="104" y="86" class="t">A = 1</text><text x="104" y="116" class="t">B = 1</text>
<line x1="146" y1="82" x2="160" y2="82" class="s"/><line x1="146" y1="112" x2="160" y2="112" class="s"/>
<text x="230" y="52" class="t">Cin = 0</text><line x1="250" y1="58" x2="250" y2="60" class="s"/>
<line x1="340" y1="84" x2="390" y2="84" class="s"/><text x="398" y="88" class="t">S</text>
<line x1="340" y1="136" x2="390" y2="136" class="s"/><text x="398" y="140" class="t">Cout</text>
<text x="420" y="100" class="m">求 S 与 Cout</text>
</svg>
