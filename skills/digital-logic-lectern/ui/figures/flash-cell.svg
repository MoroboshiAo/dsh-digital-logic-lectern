<line x1="415" y1="220" x2="415" y2="262" class="g"/>
<text x="415" y="278" class="m" text-anchor="middle">漏极</text>
<text x="480" y="240" class="m">浮栅有电荷：读 0</text>
<text x="480" y="264" class="m">浮栅无电荷：读 1</text>
