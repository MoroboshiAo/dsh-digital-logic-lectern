<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="FLASH 存储元的浮栅 MOS 剖面结构">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">FLASH 存储元结构</text>
<rect x="90" y="200" width="380" height="52" rx="4" class="box"/>
<text x="280" y="233" class="m" text-anchor="middle">P 型衬底</text>
<rect x="110" y="200" width="70" height="20" fill="#20351a" stroke="#58cc02" stroke-width="1.5"/>
<rect x="380" y="200" width="70" height="20" fill="#20351a" stroke="#58cc02" stroke-width="1.5"/>
<rect x="180" y="186" width="200" height="14" fill="#3a4250"/>
<rect x="180" y="166" width="200" height="20" fill="#20351a" stroke="#58cc02" stroke-width="1.5"/>
<rect x="180" y="152" width="200" height="14" fill="#3a4250"/>
<rect x="180" y="130" width="200" height="22" class="box"/>
<line x1="380" y1="141" x2="472" y2="144" class="g"/>
<text x="480" y="148" class="m">控制栅</text>
<line x1="380" y1="176" x2="472" y2="180" class="g"/>
<text x="480" y="184" class="m">浮栅</text>
