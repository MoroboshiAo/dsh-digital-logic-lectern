<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" role="img" aria-label="一种可编程逻辑器件的与阵列和或阵列">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">题图：PLD 阵列</text>
<line x1="50" y1="65" x2="50" y2="195" class="g"/><line x1="90" y1="65" x2="90" y2="195" class="g"/><line x1="130" y1="65" x2="130" y2="195" class="g"/>
<line x1="40" y1="85" x2="220" y2="85" class="g"/><line x1="40" y1="125" x2="220" y2="125" class="g"/><line x1="40" y1="165" x2="220" y2="165" class="g"/>
<text x="40" y="215" class="m">与阵列可编程</text>
<line x1="240" y1="65" x2="240" y2="195" class="g"/>
<line x1="260" y1="65" x2="260" y2="195" class="g"/><line x1="300" y1="65" x2="300" y2="195" class="g"/><line x1="340" y1="65" x2="340" y2="195" class="g"/><line x1="380" y1="65" x2="380" y2="195" class="g"/>
<line x1="240" y1="85" x2="420" y2="85" class="g"/><line x1="240" y1="125" x2="420" y2="125" class="g"/><line x1="240" y1="165" x2="420" y2="165" class="g"/>
<text x="255" y="215" class="m">或阵列固定</text>
<line x1="220" y1="85" x2="240" y2="85" class="s"/><line x1="220" y1="125" x2="240" y2="125" class="s"/><line x1="220" y1="165" x2="240" y2="165" class="s"/>
