<rect x="60" y="60" width="120" height="55" rx="6" class="box"/><text x="120" y="92" class="t" text-anchor="middle">GLB 1</text>
<rect x="460" y="60" width="120" height="55" rx="6" class="box"/><text x="520" y="92" class="t" text-anchor="middle">GLB 2</text>
<rect x="60" y="160" width="120" height="55" rx="6" class="box"/><text x="120" y="192" class="t" text-anchor="middle">GLB 3</text>
<rect x="460" y="160" width="120" height="55" rx="6" class="box"/><text x="520" y="192" class="t" text-anchor="middle">GLB 4</text>
<line x1="180" y1="88" x2="230" y2="115" class="s"/><path d="M230 115 l-7 -3.5 v7 z" fill="#58cc02"/><line x1="230" y1="175" x2="180" y2="188" class="s"/><path d="M180 188 l-7 -3.5 v7 z" fill="#58cc02"/><line x1="460" y1="88" x2="410" y2="115" class="s"/><path d="M410 115 l-7 -3.5 v7 z" fill="#58cc02"/><line x1="410" y1="175" x2="460" y2="188" class="s"/><path d="M460 188 l-7 -3.5 v7 z" fill="#58cc02"/>
<rect x="240" y="205" width="160" height="40" rx="6" class="box"/><text x="320" y="230" class="t" text-anchor="middle">ISP 编程控制</text>
