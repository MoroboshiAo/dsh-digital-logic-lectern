<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="一个 Verilog 模块的结构">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">Verilog 模块的骨架</text>
<rect x="24" y="44" width="592" height="120" rx="8" fill="#1b2029" stroke="#3a4250" stroke-width="1.5"/>
<text x="44" y="76" class="code">module and2 (input a, input b, output y);</text>
<text x="44" y="100" class="code">    assign y = a &amp; b;</text>
<text x="44" y="124" class="code">endmodule</text>
<rect x="32" y="196" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="32" y="228" width="12" height="12" rx="2" fill="#58cc02"/>
<rect x="32" y="260" width="12" height="12" rx="2" fill="#58cc02"/>
<text x="56" y="208" class="t">module 与 endmodule 划定模块边界</text>
<text x="56" y="240" class="t">端口表写方向、位宽和名字</text>
<text x="56" y="272" class="t">assign 是连续赋值，输入一变就更新</text>
</svg>
