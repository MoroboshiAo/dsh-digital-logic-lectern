<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="三状态时序电路的状态转移图">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#58cc02"/></marker></defs>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">状态转移图</text>
<circle cx="150" cy="95" r="34" fill="#1b2029" stroke="#58cc02" stroke-width="2"/>
<circle cx="340" cy="95" r="34" fill="#1b2029" stroke="#58cc02" stroke-width="2"/>
<circle cx="245" cy="225" r="34" fill="#1b2029" stroke="#58cc02" stroke-width="2"/>
<text x="150" y="101" class="t" text-anchor="middle">S0</text>
<text x="340" y="101" class="t" text-anchor="middle">S1</text>
<text x="245" y="231" class="t" text-anchor="middle">S2</text>
<line x1="184" y1="95" x2="300" y2="95" class="s" marker-end="url(#ar)"/>
<text x="242" y="85" class="m" text-anchor="middle">1/0</text>
<line x1="320" y1="122" x2="267" y2="198" class="s" marker-end="url(#ar)"/>
<text x="306" y="170" class="m" text-anchor="middle">1/1</text>
<line x1="225" y1="198" x2="171" y2="123" class="s" marker-end="url(#ar)"/>
<text x="182" y="176" class="m" text-anchor="middle">0/1</text>
<path d="M124 68 C116 32 184 32 176 68" class="s" marker-end="url(#ar)"/>
<text x="150" y="30" class="m" text-anchor="middle">0/0</text>
<text x="392" y="196" class="m">转移线读作</text>
<text x="392" y="220" class="t">输入 / 输出</text>
<text x="392" y="252" class="m">S0 为初态</text>
</svg>
