<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="异或门与同或门的符号、表达式和真值表">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">异或门与同或门</text>
<rect x="40" y="70" width="110" height="70" rx="6" class="box"/><text x="95" y="112" class="t" text-anchor="middle">=1</text>
<text x="20" y="96" class="t">A</text><text x="20" y="128" class="t">B</text><line x1="30" y1="92" x2="40" y2="92" class="s"/><line x1="30" y1="124" x2="40" y2="124" class="s"/>
<line x1="150" y1="105" x2="190" y2="105" class="s"/><text x="196" y="109" class="t">F = A′B + AB′ = A ⊕ B</text>
<rect x="40" y="155" width="110" height="60" rx="6" class="box"/><text x="95" y="190" class="t" text-anchor="middle">=1</text><circle cx="156" cy="185" r="6" class="s"/>
<text x="20" y="176" class="t">A</text><text x="20" y="204" class="t">B</text><line x1="30" y1="172" x2="40" y2="172" class="s"/><line x1="30" y1="200" x2="40" y2="200" class="s"/>
<line x1="162" y1="185" x2="190" y2="185" class="s"/><text x="196" y="189" class="t">F = AB + A′B′ = A ⊙ B</text>
<text x="392" y="62" class="m">真值表</text>
<rect x="380" y="72" width="220" height="140" rx="0" class="g"/>
<line x1="380" y1="104" x2="600" y2="104" class="g"/><line x1="380" y1="136" x2="600" y2="136" class="g"/><line x1="380" y1="168" x2="600" y2="168" class="g"/>
<line x1="436" y1="72" x2="436" y2="212" class="g"/><line x1="492" y1="72" x2="492" y2="212" class="g"/><line x1="546" y1="72" x2="546" y2="212" class="g"/>
<text x="408" y="92" class="t" text-anchor="middle">A</text><text x="464" y="92" class="t" text-anchor="middle">B</text><text x="519" y="92" class="t" text-anchor="middle">异或</text><text x="573" y="92" class="t" text-anchor="middle">同或</text>
<text x="408" y="124" class="t" text-anchor="middle">0</text><text x="464" y="124" class="t" text-anchor="middle">0</text><text x="519" y="124" class="t" text-anchor="middle">0</text><text x="573" y="124" class="t" text-anchor="middle">1</text>
<text x="408" y="156" class="t" text-anchor="middle">0</text><text x="464" y="156" class="t" text-anchor="middle">1</text><text x="519" y="156" class="t" text-anchor="middle">1</text><text x="573" y="156" class="t" text-anchor="middle">0</text>
<text x="408" y="188" class="t" text-anchor="middle">1</text><text x="464" y="188" class="t" text-anchor="middle">0</text><text x="519" y="188" class="t" text-anchor="middle">1</text><text x="573" y="188" class="t" text-anchor="middle">0</text>
<text x="408" y="208" class="t" text-anchor="middle">1</text><text x="464" y="208" class="t" text-anchor="middle">1</text><text x="519" y="208" class="t" text-anchor="middle">0</text><text x="573" y="208" class="t" text-anchor="middle">1</text>
</svg>
