<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="量化把连续输入折成阶梯，量化单位 q，最大误差为 q 的一半">
<style>
.s{fill:none;stroke:#3a4250;stroke-width:1.4}
.d{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 5}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:13px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">量化特性</text>
<line x1="70" y1="60" x2="70" y2="280" class="s"/>
<line x1="70" y1="280" x2="580" y2="280" class="s"/>
<path d="M90 250 H150 V220 H210 V190 H270 V160 H330 V130 H390 V100 H450 V70 H510" fill="none" stroke="#58cc02" stroke-width="2.2" stroke-linejoin="round"/>
<line x1="90" y1="250" x2="510" y2="70" class="d"/>
<line x1="70" y1="100" x2="84" y2="100" class="s"/>
<text x="34" y="104" class="m">q</text>
<text x="584" y="284" class="m">u</text>
<text x="56" y="64" class="m" text-anchor="end">输出</text>
<text x="90" y="306" class="m">同一码对应一段输入范围，交界处取整</text>
<text x="400" y="306" class="m">量化误差 ≤ q / 2</text>
</svg>
