<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="单总线数据通路的寄存器、运算部件与三态门">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">单总线数据通路</text>
<line x1="60" y1="170" x2="580" y2="170" class="s"/><line x1="60" y1="178" x2="580" y2="178" class="s"/>
<text x="40" y="166" class="m">总线</text>
<rect x="70" y="70" width="70" height="50" rx="6" class="box"/><text x="105" y="100" class="t" text-anchor="middle">R0</text><rect x="160" y="70" width="70" height="50" rx="6" class="box"/><text x="195" y="100" class="t" text-anchor="middle">R1</text><rect x="250" y="70" width="70" height="50" rx="6" class="box"/><text x="285" y="100" class="t" text-anchor="middle">R2</text><rect x="340" y="70" width="70" height="50" rx="6" class="box"/><text x="375" y="100" class="t" text-anchor="middle">R3</text>
<line x1="105" y1="120" x2="105" y2="146" class="s"/><path d="M98 146 l7 14 l7 -14 z" fill="#58cc02"/><line x1="105" y1="160" x2="105" y2="170" class="s"/><line x1="195" y1="120" x2="195" y2="146" class="s"/><path d="M98 146 l7 14 l7 -14 z" fill="#58cc02"/><line x1="195" y1="160" x2="195" y2="170" class="s"/><line x1="285" y1="120" x2="285" y2="146" class="s"/><path d="M98 146 l7 14 l7 -14 z" fill="#58cc02"/><line x1="285" y1="160" x2="285" y2="170" class="s"/><line x1="375" y1="120" x2="375" y2="146" class="s"/><path d="M98 146 l7 14 l7 -14 z" fill="#58cc02"/><line x1="375" y1="160" x2="375" y2="170" class="s"/>
<text x="400" y="140" class="m">三态输出</text>
<rect x="250" y="205" width="140" height="55" rx="6" class="box"/><text x="320" y="238" class="t" text-anchor="middle">ALU</text>
<line x1="280" y1="205" x2="280" y2="178" class="s"/><line x1="360" y1="205" x2="360" y2="178" class="s"/>
<line x1="320" y1="260" x2="320" y2="272" class="s"/><text x="328" y="288" class="m">结果回总线</text>
<line x1="470" y1="70" x2="470" y2="205" class="s"/><text x="476" y="120" class="m">控制信号</text><text x="476" y="140" class="m">选择源与操作</text>
</svg>
