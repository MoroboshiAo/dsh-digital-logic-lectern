<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" role="img" aria-label="TTL 与 CMOS 两类数字集成电路的特点对比">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">两类数字集成电路工艺</text>
<rect x="24" y="50" width="284" height="200" rx="8" class="box"/>
<rect x="332" y="50" width="284" height="200" rx="8" class="box"/>
<text x="44" y="82" class="b">双极型 TTL</text>
<text x="44" y="114" class="t">代表：74LS、74F</text>
<text x="44" y="144" class="t">电源：5 V</text>
<text x="44" y="174" class="t">速度：快</text>
<text x="44" y="204" class="t">驱动能力：强</text>
<text x="44" y="234" class="t">功耗：较大</text>
<text x="352" y="82" class="b">MOS（CMOS）</text>
<text x="352" y="114" class="t">代表：4000、74HC</text>
<text x="352" y="144" class="t">电源：3～18 V</text>
<text x="352" y="174" class="t">速度：中等</text>
<text x="352" y="204" class="t">输入阻抗：高</text>
<text x="352" y="234" class="t">静态功耗：极低</text>
</svg>
