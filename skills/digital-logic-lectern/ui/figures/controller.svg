<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-label="小型控制器由状态寄存器与组合逻辑组成">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.d{fill:none;stroke:#3a4250;stroke-width:1.2;stroke-dasharray:5 5}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.code{fill:#e6e8ee;font-family:"Consolas","Courier New",monospace;font-size:13px}
</style><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#58cc02"/></marker></defs>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">小型控制器的组成</text>
<rect x="60" y="100" width="120" height="70" rx="7" class="box"/>
<text x="120" y="141" class="t" text-anchor="middle">状态寄存器</text>
<rect x="280" y="80" width="200" height="110" rx="7" class="box"/>
<text x="380" y="128" class="t" text-anchor="middle">组合逻辑</text>
<text x="380" y="154" class="m" text-anchor="middle">决定次态与输出</text>
<line x1="180" y1="120" x2="276" y2="120" class="s" marker-end="url(#ar)"/>
<text x="228" y="110" class="m" text-anchor="middle">现态</text>
<path d="M280 170 H240 V200 H120 V174" class="s" marker-end="url(#ar)"/>
<text x="196" y="218" class="m" text-anchor="middle">次态</text>
<line x1="90" y1="244" x2="90" y2="174" class="s" marker-end="url(#ar)"/>
<text x="98" y="228" class="m">CLK</text>
<line x1="380" y1="44" x2="380" y2="76" class="s" marker-end="url(#ar)"/>
<text x="380" y="34" class="m" text-anchor="middle">外部信号、状态标志</text>
<line x1="480" y1="120" x2="556" y2="120" class="s" marker-end="url(#ar)"/>
<text x="520" y="110" class="m" text-anchor="middle">控制信号</text>
</svg>
