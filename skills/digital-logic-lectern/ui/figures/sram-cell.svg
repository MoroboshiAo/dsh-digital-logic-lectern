<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" role="img" aria-label="六管 SRAM 存储元的双稳态结构与位线连接">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">六管 SRAM 存储元</text>
<line x1="120" y1="55" x2="120" y2="220" class="s"/><line x1="150" y1="55" x2="150" y2="220" class="s"/><line x1="120" y1="55" x2="520" y2="55" class="s"/>
<text x="96" y="48" class="t">BL</text><text x="132" y="48" class="t">BL̄</text><text x="470" y="46" class="m">WL</text>
<rect x="220" y="80" width="120" height="55" rx="6" class="box"/><text x="280" y="113" class="t" text-anchor="middle">反相器 1</text>
<rect x="220" y="155" width="120" height="55" rx="6" class="box"/><text x="280" y="188" class="t" text-anchor="middle">反相器 2</text>
<line x1="340" y1="100" x2="390" y2="100" class="s"/><line x1="390" y1="100" x2="390" y2="190" class="s"/><line x1="390" y1="190" x2="340" y2="190" class="s"/>
<line x1="220" y1="190" x2="170" y2="190" class="s"/><line x1="170" y1="190" x2="170" y2="100" class="s"/><line x1="170" y1="100" x2="220" y2="100" class="s"/>
<rect x="160" y="120" width="24" height="24" class="box"/><rect x="160" y="140" width="24" height="24" class="box"/>
<line x1="150" y1="70" x2="160" y2="70" class="s"/><line x1="160" y1="70" x2="160" y2="120" class="s"/>
<line x1="150" y1="200" x2="160" y2="200" class="s"/><line x1="160" y1="200" x2="160" y2="164" class="s"/>
<line x1="340" y1="100" x2="420" y2="100" class="s"/><line x1="420" y1="100" x2="420" y2="150" class="s"/>
<line x1="340" y1="190" x2="470" y2="190" class="s"/><line x1="470" y1="190" x2="470" y2="165" class="s"/>
<text x="210" y="238" class="m">M1-M4 交叉耦合保持状态，M5、M6 受字线控制接入位线</text>
<text x="430" y="90" class="m">Q</text><text x="430" y="176" class="m">Q̄</text>
<text x="330" y="214" class="m">不断电即可保持</text>
</svg>
