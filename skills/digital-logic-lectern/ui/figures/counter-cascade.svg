<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="两片四位同步计数器级联扩展为八位">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
.hl{fill:none;stroke:#58cc02;stroke-width:2;stroke-dasharray:6 4}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">同步级联</text>
<rect x="50" y="70" width="190" height="100" rx="6" class="box"/><text x="145" y="105" class="b" text-anchor="middle">74LS161 低位</text><text x="145" y="135" class="m" text-anchor="middle">Q0-Q3</text>
<rect x="360" y="70" width="190" height="100" rx="6" class="box"/><text x="455" y="105" class="b" text-anchor="middle">74LS161 高位</text><text x="455" y="135" class="m" text-anchor="middle">Q4-Q7</text>
<text x="30" y="130" class="t">CLK</text><line x1="40" y1="126" x2="50" y2="126" class="s"/>
<line x1="240" y1="126" x2="360" y2="126" class="s"/><text x="268" y="116" class="m">RCO</text>
<line x1="300" y1="185" x2="300" y2="170" class="s"/><line x1="300" y1="170" x2="250" y2="170" class="s"/><line x1="250" y1="170" x2="250" y2="150" class="s"/>
<line x1="300" y1="170" x2="550" y2="170" class="s"/><line x1="550" y1="170" x2="550" y2="150" class="s"/>
<text x="318" y="192" class="m">ENT / ENP</text>
<line x1="240" y1="60" x2="360" y2="60" class="s"/><text x="270" y="50" class="m">进位</text>
<text x="50" y="224" class="m">低位计满后经 RCO 使能高位，两片共用同一时钟</text>
</svg>
