<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="微指令格式与控制存储器读出流程">
<style>
.s{fill:none;stroke:#58cc02;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}
.b{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px;font-weight:600}
.m{fill:#9aa2b1;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:12.5px}
.g{fill:none;stroke:#3a4250;stroke-width:1.2}
.box{fill:#1b2029;stroke:#3a4250;stroke-width:1.5}
</style>
<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="28" class="b">微指令格式</text>
<rect x="60" y="70" width="120" height="70" rx="6" class="box"/><text x="120" y="110" class="t" text-anchor="middle">控制存储器</text>
<line x1="180" y1="105" x2="220" y2="105" class="s"/><path d="M220 105 l-7 -3.5 v7 z" fill="#58cc02"/>
<rect x="220" y="70" width="80" height="70" rx="6" class="box"/><text x="260" y="110" class="t" text-anchor="middle">微指令寄存器</text>
<rect x="330" y="60" width="250" height="90" rx="6" class="box"/>
<line x1="400" y1="60" x2="400" y2="150" class="s"/><line x1="490" y1="60" x2="490" y2="150" class="s"/>
<text x="365" y="112" class="t" text-anchor="middle">下址</text><text x="445" y="112" class="t" text-anchor="middle">操作控制</text><text x="535" y="112" class="t" text-anchor="middle">判别</text>
<text x="330" y="180" class="m">下址字段决定后继微地址</text>
<text x="330" y="206" class="m">操作控制字段直接或译码后输出控制信号</text>
<rect x="80" y="190" width="120" height="40" rx="6" class="box"/><text x="140" y="215" class="t" text-anchor="middle">微地址寄存器</text>
<line x1="140" y1="190" x2="140" y2="140" class="s"/><path d="M140 140 l-7 -3.5 v7 z" fill="#58cc02"/>
<text x="60" y="250" class="m">机器指令操作码映射为微程序入口</text>
</svg>
