<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="D、JK、T 三种触发器的符号与特性方程">
	<g fill="#1c1f26" stroke="#58cc02" stroke-width="2.2" rx="8">
		<rect x="40" y="50" width="130" height="120" rx="10"/>
		<rect x="240" y="50" width="140" height="120" rx="10"/>
		<rect x="450" y="50" width="130" height="120" rx="10"/>
	</g>
	<g fill="none" stroke="#8b93a1" stroke-width="2" stroke-linecap="round">
		<path d="M12 86h28M12 134h28M170 110h34"/>
		<path d="M212 86h28M212 122h28M212 158h28M380 110h36"/>
		<path d="M422 86h28M422 134h28M580 110h28"/>
		<path d="M52 150l14 10-14 10"/>
		<path d="M252 150l14 10-14 10"/>
		<path d="M462 150l14 10-14 10"/>
	</g>
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#9aa2b1" font-size="13">
		<text x="12" y="78">D</text>
		<text x="12" y="124">CLK</text>
		<text x="176" y="102">Q</text>
		<text x="206" y="78">J</text>
		<text x="206" y="114">CLK</text>
		<text x="206" y="150">K</text>
		<text x="388" y="102">Q</text>
		<text x="416" y="78">T</text>
		<text x="416" y="126">CLK</text>
		<text x="584" y="102">Q</text>
	</g>
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
		<text x="105" y="120" fill="#e6e8ee" font-size="16" font-weight="600">D</text>
		<text x="310" y="120" fill="#e6e8ee" font-size="16" font-weight="600">JK</text>
		<text x="515" y="120" fill="#e6e8ee" font-size="16" font-weight="600">T</text>
		<text x="105" y="212" fill="#9aa2b1" font-size="13">Q* = D</text>
		<text x="310" y="212" fill="#9aa2b1" font-size="13">Q* = JQ′ + K′Q</text>
		<text x="515" y="212" fill="#9aa2b1" font-size="13">Q* = T ⊕ Q</text>
		<text x="310" y="238" fill="#6b7280" font-size="11">J=K=1 时翻转，J=K=0 时保持</text>
	</g>
</svg>
