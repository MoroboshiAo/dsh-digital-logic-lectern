<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="五变量卡诺图分成 E 为 0 与 E 为 1 两层，同位置的两格相邻">
<style>
	.t{fill:#e6e8ee;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:16px}
