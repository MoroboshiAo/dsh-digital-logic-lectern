<rect width="100%" height="100%" fill="#141821"/>
<text x="24" y="30" class="b">五变量卡诺图的两层叠放</text>
<text x="188" y="60" class="m" text-anchor="middle">E = 0</text>
<text x="480" y="60" class="m" text-anchor="middle">E = 1</text>
<text x="92" y="84" class="m" text-anchor="end">AB\CD</text>
<g class="m" text-anchor="middle">
	<text x="122" y="84">00</text><text x="166" y="84">01</text><text x="210" y="84">11</text><text x="254" y="84">10</text>
	<text x="414" y="84">00</text><text x="458" y="84">01</text><text x="502" y="84">11</text><text x="546" y="84">10</text>
</g>
<g class="g">
	<rect x="100" y="92" width="176" height="176"/>
	<path d="M100 136h176M100 180h176M100 224h176M144 92v176M188 92v176M232 92v176"/>
	<rect x="392" y="92" width="176" height="176"/>
