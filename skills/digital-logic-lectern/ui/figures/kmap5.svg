</g>
<g class="m" text-anchor="end">
	<text x="92" y="118">00</text><text x="92" y="162">01</text><text x="92" y="206">11</text><text x="92" y="250">10</text>
	<text x="384" y="118">00</text><text x="384" y="162">01</text><text x="384" y="206">11</text><text x="384" y="250">10</text>
</g>
<rect x="102" y="94" width="40" height="40" fill="none" stroke="#58cc02" stroke-width="2"/>
<rect x="394" y="94" width="40" height="40" fill="none" stroke="#58cc02" stroke-width="2"/>
<text x="122" y="122" class="t" text-anchor="middle">1</text>
<text x="414" y="122" class="t" text-anchor="middle">1</text>
<text x="334" y="118" class="m" text-anchor="middle">同格</text>
<text x="334" y="304" class="m" text-anchor="middle">同位置的两格上下相邻，中轴左右对称的格也相邻</text>
