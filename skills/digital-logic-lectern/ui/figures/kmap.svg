<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 310" role="img" aria-label="三变量卡诺图，1 格为最小项 0、1、3、7，圈组得到 A′B′ 与 BC">
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
		<text x="230" y="24" fill="#58cc02" font-size="14" font-weight="600">三变量卡诺图（C 分列，AB 分行）</text>
		<g fill="#9aa2b1" font-size="13">
			<text x="90" y="56">AB \ C</text>
			<text x="200" y="56">0</text>
			<text x="320" y="56">1</text>
			<text x="90" y="92">00</text>
			<text x="90" y="136">01</text>
			<text x="90" y="180">11</text>
			<text x="90" y="224">10</text>
		</g>
		<g fill="#e6e8ee" font-size="18" font-weight="600">
			<text x="200" y="92">1</text><text x="320" y="92">1</text>
			<text x="200" y="136">0</text><text x="320" y="136">1</text>
			<text x="200" y="180">0</text><text x="320" y="180">1</text>
			<text x="200" y="224">0</text><text x="320" y="224">0</text>
		</g>
		<g fill="#6b7280" font-size="10">
			<text x="200" y="106">m0</text><text x="320" y="106">m1</text>
			<text x="200" y="150">m2</text><text x="320" y="150">m3</text>
			<text x="200" y="194">m6</text><text x="320" y="194">m7</text>
			<text x="200" y="238">m4</text><text x="320" y="238">m5</text>
		</g>
	</g>
	<g fill="none" stroke="#3a4250" stroke-width="1.4">
		<rect x="140" y="64" width="240" height="180"/>
		<path d="M140 108h240M140 152h240M140 196h240"/>
		<path d="M260 64v180"/>
	</g>
	<g fill="none" stroke="#58cc02" stroke-width="2.4">
		<rect x="148" y="72" width="224" height="28" rx="14"/>
		<rect x="266" y="116" width="108" height="72" rx="14"/>
	</g>
	<g font-family="Segoe UI, Microsoft YaHei, sans-serif" text-anchor="middle">
		<text x="230" y="278" fill="#e6e8ee" font-size="16">F = A′B′ + BC</text>
		<text x="230" y="300" fill="#9aa2b1" font-size="12">上面横圈是 A′B′，右侧竖圈是 BC</text>
	</g>
</svg>
