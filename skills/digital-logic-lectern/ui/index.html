<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字逻辑辅助学习插件</title>
<meta name="author" content="刘柏铭（Liu Baiming）">
<meta name="description" content="数字逻辑课程学习资料、章节自测与人机对战、错题本。">
<script>
(function () {
	try {
		var mode = localStorage.getItem("dl-theme-v1") || "system";
		var dark = mode === "dark" || (mode === "system" && window.matchMedia
			&& window.matchMedia("(prefers-color-scheme: dark)").matches);
		document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
	} catch (error) { /* 读不到就按浅色 */ }
})();
</script>
<style>
	:root {
		color-scheme: light;
		--topbar-h: 61px;
		--bg: #f7f8fa;
		--card: #ffffff;
		--text: #1f2430;
		--muted: #6f7683;
		--line: #e4e7ec;
		--soft: #f1f3f6;
		--primary: #58cc02;
		--primary-dark: #46a302;
		--primary-soft: #e9f9dc;
		--primary-ink: #2f7a00;
		--blue: #1cb0f6;
		--bad: #ff4b4b;
		--warn: #ffc800;
		--topbar: rgba(247, 248, 250, 0.92);
		--heading: #101828;
		--body-text: #333945;
		--toc-text: #4b5563;
		--code-bg: #f6f8fa;
		--code-text: #24292f;
		--inline-code: #b45309;
		--warn-bg: #fffaeb;
		--warn-text: #7a5b00;
		--link: #0b7fb3;
		--link-line: #bfe7f8;
		--th-bg: #f7faf4;
		--chip-active: #e7f7ff;
		--tag-bg: #eef4ff;
		--tag-text: #3b6fd4;
		--ok-border: #b7e79a;
		--ok-bg: #f7fdf2;
		--bad-border: #ffc7c7;
		--bad-bg: #fff7f7;
		--option-wrong: #fff0f0;
		--soft-bg: #fafbfc;
		--ai-bg: #f4f7ff;
		--ai-border: #dde6ff;
		--ai-track: #e2e8f5;
		--hover-soft: #fafafa;
		--hover-line: #cfd6e0;
		--hover-line2: #c9d4e2;
		--result-hover: #fbfdff;
		--mark: #fff3b0;
		--gold: #e08a00;
		--info-border: #b9c0cc;
		--info-text: #8b93a1;
		--tooltip-bg: #1f2937;
		--shadow: rgba(0, 0, 0, 0.08);
		--shadow-lg: rgba(16, 24, 40, 0.18);
	}

	html[data-theme="dark"] {
		color-scheme: dark;
		--bg: #15171c;
		--card: #1c1f26;
		--text: #e6e8ee;
		--muted: #9aa2b1;
		--line: #2c313b;
		--soft: #232730;
		--primary: #58cc02;
		--primary-dark: #46a302;
		--primary-soft: #1f3313;
		--primary-ink: #8ee05a;
		--blue: #5cc8ff;
		--bad: #ff6b6b;
		--warn: #ffc800;
		--topbar: rgba(21, 23, 28, 0.92);
		--heading: #f2f4f8;
		--body-text: #c9ced9;
		--toc-text: #a8b0be;
		--code-bg: #22262e;
		--code-text: #d6dae3;
		--inline-code: #ffb26b;
		--warn-bg: #2b2412;
		--warn-text: #f0cf7a;
		--link: #5cc8ff;
		--link-line: #2c5568;
		--th-bg: #202720;
		--chip-active: #123241;
		--tag-bg: #1b2740;
		--tag-text: #9dbcff;
		--ok-border: #35602a;
		--ok-bg: #16220f;
		--bad-border: #5a2a2a;
		--bad-bg: #261417;
		--option-wrong: #2a1a1d;
		--soft-bg: #1f232b;
		--ai-bg: #1a2030;
		--ai-border: #2a3550;
		--ai-track: #2b3344;
		--hover-soft: #262b35;
		--hover-line: #3a4250;
		--hover-line2: #3a4250;
		--result-hover: #1d2530;
		--mark: #5c4a12;
		--gold: #ffc25c;
		--info-border: #4a5160;
		--info-text: #9aa2b1;
		--tooltip-bg: #0e1014;
		--shadow: rgba(0, 0, 0, 0.4);
		--shadow-lg: rgba(0, 0, 0, 0.5);
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		min-height: 100vh;
		padding-top: var(--topbar-h);
		background: var(--bg);
		color: var(--text);
		font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
		-webkit-font-smoothing: antialiased;
	}

	.shell { max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; }

	.topbar-wrap {
		position: fixed; top: 0; left: 0; right: 0; z-index: 30;
		background: var(--topbar);
		backdrop-filter: blur(8px);
		border-bottom: 1px solid var(--line);
	}

	.header {
		max-width: 1080px; margin: 0 auto; padding: 12px 20px;
		display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
	}
	.brand { display: flex; align-items: center; gap: 10px; }
	.brand .brandicon { width: 34px; height: 34px; display: block; color: var(--primary-dark); }
	.brand .brandicon svg { width: 34px; height: 34px; }
	h1 { font-size: 18px; margin: 0; font-weight: 700; letter-spacing: 0.2px; }

	.themebtn {
		width: 36px; height: 36px; flex: 0 0 auto; display: grid; place-items: center;
		border: 1px solid var(--line); border-radius: 10px; background: var(--card);
		color: var(--muted); cursor: pointer; box-shadow: 0 1px 3px var(--shadow);
	}
	.themebtn:hover { color: var(--text); }
	.themebtn svg { width: 18px; height: 18px; }

	.tabs { display: flex; gap: 4px; background: var(--soft); padding: 4px; border-radius: 12px; }
	.tab {
		border: none; background: transparent; color: var(--muted);
		padding: 8px 16px; border-radius: 9px; cursor: pointer;
		font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 7px;
	}
	.tab:hover { color: var(--text); }
	.tab.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px var(--shadow); font-weight: 600; }
	.tab svg { width: 17px; height: 17px; }
	.tab .badge {
		min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
		background: var(--bad); color: #fff; font-size: 11px; font-weight: 700;
		display: inline-grid; place-items: center;
	}
	.tab .badge[hidden] { display: none; }

	.learn { margin-top: 20px; }

	.searchbar { position: relative; margin-bottom: 16px; }
	.searchbar svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
	.searchbar input {
		width: 100%; padding: 13px 16px 13px 42px;
		border: 2px solid var(--line); border-radius: 12px;
		background: var(--card); color: var(--text);
		font: inherit; font-size: 15px; outline: none;
	}
	.searchbar input:focus { border-color: var(--blue); }

	.layout { display: grid; grid-template-columns: 268px 1fr; gap: 20px; align-items: start; }

	.panel { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }

	.toc { padding: 10px; position: sticky; top: calc(var(--topbar-h) + 16px); max-height: calc(100vh - var(--topbar-h) - 32px); overflow: auto; }
	.toc-chapter {
		display: block; width: 100%; text-align: left; border: none; background: transparent;
		color: var(--text); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
		padding: 9px 10px; border-radius: 9px; line-height: 1.5;
	}
	.toc-chapter:hover { background: var(--soft); }
	.toc-chapter.active { background: var(--primary-soft); color: var(--primary-ink); font-weight: 600; }
	.toc-sections { margin: 2px 0 8px; }
	.toc-sec-head { display: flex; align-items: center; gap: 2px; }
	.toc-sec-head a {
		flex: 1; padding: 7px 10px 7px 20px; border-radius: 8px;
		color: var(--toc-text); font-size: 13px; line-height: 1.5; text-decoration: none;
	}
	.toc-sec-head a:hover { background: var(--soft); color: var(--text); }
	.caret {
		width: 26px; height: 26px; flex: 0 0 auto; border: none; background: transparent;
		color: var(--muted); cursor: pointer; border-radius: 7px; display: grid; place-items: center;
	}
	.caret:hover { background: var(--soft); color: var(--text); }
	.caret svg { width: 14px; height: 14px; transition: transform 0.15s ease; }
	.caret.open svg { transform: rotate(90deg); }
	.toc-subs { display: grid; gap: 1px; margin: 1px 0 4px; }
	.toc-subs[hidden] { display: none; }
	.toc-subs a {
		padding: 6px 10px 6px 36px; border-radius: 8px; color: var(--muted);
		font-size: 12.5px; line-height: 1.5; text-decoration: none;
	}
	.toc-subs a:hover { background: var(--soft); color: var(--text); }

	.reader { padding: 30px 34px 34px; }
	.reader h1 { font-size: 24px; margin: 0 0 20px; }
	.reader h2 {
		font-size: 18px; margin: 34px 0 12px; padding-top: 20px;
		border-top: 1px solid var(--line); scroll-margin-top: calc(var(--topbar-h) + 20px);
	}
	.reader section:first-of-type h2 { border-top: none; padding-top: 0; margin-top: 0; }
	.reader h3 { font-size: 15px; margin: 22px 0 8px; color: var(--heading); scroll-margin-top: calc(var(--topbar-h) + 20px); }
	.reader .num { color: var(--muted); font-weight: 600; margin-right: 6px; font-variant-numeric: tabular-nums; }
	.reader p { line-height: 1.9; margin: 0 0 12px; color: var(--body-text); }
	.reader ul, .reader ol { margin: 0 0 14px; padding-left: 22px; line-height: 1.9; color: var(--body-text); }
	.reader li { margin-bottom: 5px; }
	.reader strong { font-weight: 600; }
	.reader code { background: var(--soft); padding: 1px 6px; border-radius: 5px; font-size: 13px; color: var(--inline-code); }
	.reader pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; margin: 0 0 14px; }
	.reader pre code { background: none; padding: 0; color: var(--code-text); line-height: 1.7; }
	.reader .pitfall {
		background: var(--warn-bg); border-left: 3px solid var(--warn); border-radius: 8px;
		padding: 9px 12px; color: var(--warn-text); font-size: 13.5px; line-height: 1.8;
	}
	.reader a { color: var(--link); text-decoration: none; border-bottom: 1px solid var(--link-line); }
	.reader a:hover { border-bottom-color: var(--link); }
	.reader figure { margin: 0 0 16px; }
	.reader figure img {
		display: block; width: 100%; height: auto;
		border: 1px solid var(--line); border-radius: 12px; background: #141821;
	}
	.reader figcaption { margin-top: 7px; color: var(--muted); font-size: 12.5px; line-height: 1.6; text-align: center; }
	.qfig {
		display: block; width: 100%; max-width: 420px; height: auto;
		margin: 4px 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #141821;
	}
	.reader h2.flash, .reader h3.flash { animation: flash 1.6s ease; }

	.table-wrap { overflow-x: auto; margin-bottom: 16px; }
	.reader table { border-collapse: collapse; width: 100%; font-size: 13px; }
	.reader th, .reader td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; line-height: 1.6; vertical-align: top; }
	.reader th { background: var(--th-bg); font-weight: 600; }
	.reader td a.jump { border-bottom: none; color: var(--link); font-variant-numeric: tabular-nums; }

	.chapter-actions { display: flex; gap: 10px; margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }

	.btn {
		display: inline-flex; align-items: center; justify-content: center; gap: 7px;
		padding: 10px 18px; border-radius: 11px; border: 2px solid var(--line);
		border-bottom-width: 4px; background: var(--card); color: var(--text);
		font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
		transition: transform 0.06s ease, background 0.12s ease;
	}
	.btn svg { width: 16px; height: 16px; }
	.btn:hover { background: var(--hover-soft); }
	.btn:active { transform: translateY(2px); border-bottom-width: 2px; }
	.btn.primary { background: var(--primary); border-color: var(--primary-dark); color: #fff; }
	.btn.primary:hover { background: #61d804; }
	.btn.ghost { color: var(--muted); font-weight: 500; }
	.btn:disabled { opacity: 0.45; cursor: not-allowed; }

	.iconbtn {
		width: 32px; height: 32px; display: grid; place-items: center;
		border: none; background: transparent; color: var(--muted);
		border-radius: 9px; cursor: pointer;
	}
	.iconbtn:hover { background: var(--soft); color: var(--text); }
	.iconbtn svg { width: 17px; height: 17px; }

	.info {
		position: relative; display: inline-grid; place-items: center;
		width: 16px; height: 16px; margin-left: 4px; border-radius: 50%;
		border: 1.5px solid var(--info-border); color: var(--info-text);
		font-size: 10px; font-weight: 700; font-style: normal; cursor: help;
		vertical-align: 1px;
	}
	.info:hover, .info:focus-visible { border-color: var(--blue); color: var(--blue); outline: none; }
	.info::after {
		content: attr(data-tip); position: absolute; z-index: 40;
		top: 140%; left: 50%; transform: translateX(-50%);
		width: 236px; padding: 9px 11px; border-radius: 9px;
		background: var(--tooltip-bg); color: #fff; font-size: 12px; font-weight: 400;
		line-height: 1.65; text-align: left; white-space: normal;
		box-shadow: 0 8px 24px var(--shadow-lg);
		opacity: 0; visibility: hidden; transition: opacity 0.12s ease;
	}
	.info:hover::after, .info:focus-visible::after { opacity: 1; visibility: visible; }

	.setup { padding: 24px; }
	.setup h2 { font-size: 17px; margin: 0 0 22px; display: flex; align-items: center; }
	.field { margin-bottom: 24px; }
	.field > label { display: flex; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
	.chips { display: flex; flex-wrap: wrap; gap: 8px; }
	.chip {
		padding: 9px 14px; border-radius: 10px; font-size: 13px; cursor: pointer;
		border: 2px solid var(--line); background: var(--card); color: var(--muted);
		font-family: inherit; font-weight: 500;
	}
	.chip:hover { border-color: var(--hover-line); color: var(--text); }
	.chip.active { border-color: var(--blue); background: var(--chip-active); color: var(--link); font-weight: 600; }
	.chip:disabled { opacity: 0.4; cursor: not-allowed; }

	.quizbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
	.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
	.stats > div { display: inline-flex; align-items: center; gap: 6px; }
	.stats svg { width: 15px; height: 15px; }
	.stats b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
	.stats .score b { color: var(--gold); }

	.card { padding: 24px; }
	.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
	.tag { font-size: 11px; padding: 4px 9px; border-radius: 7px; background: var(--tag-bg); color: var(--tag-text); font-weight: 600; }
	.stars { color: var(--warn); font-size: 12px; letter-spacing: 2px; }
	.stem { font-size: 19px; line-height: 1.75; margin: 0 0 20px; }
	.ask {
		margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
		padding: 6px 11px; border-radius: 9px; border: 1px solid var(--line);
		background: var(--card); color: var(--muted); font: inherit; font-size: 12.5px;
		cursor: pointer;
	}
	.ask:hover { border-color: var(--hover-line); color: var(--text); }
	.ask svg { width: 14px; height: 14px; }
	.toast {
		position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
		padding: 10px 16px; border-radius: 10px; background: var(--text);
		color: var(--bg); font-size: 13px; box-shadow: 0 8px 24px var(--shadow-lg);
		pointer-events: none; z-index: 40;
	}

	.options { display: grid; gap: 10px; }
	.option {
		display: flex; align-items: center; gap: 12px; padding: 14px 16px;
		background: var(--card); border: 2px solid var(--line); border-bottom-width: 4px;
		border-radius: 12px; color: var(--text); font: inherit; font-size: 16px;
		cursor: pointer; text-align: left;
	}
	.option:hover:not(:disabled) { border-color: var(--hover-line2); }
	.option:disabled { cursor: default; }
	.key {
		width: 26px; height: 26px; border-radius: 7px; flex: 0 0 auto;
		display: grid; place-items: center; background: var(--soft);
		color: var(--muted); font-size: 13px; font-weight: 700;
	}
	.option.picked { border-color: var(--blue); background: var(--chip-active); }
	.option.picked .key { background: var(--blue); color: #fff; }
	.option.correct { border-color: var(--primary); background: var(--primary-soft); }
	.option.correct .key { background: var(--primary); color: #fff; }
	.option.wrong { border-color: var(--bad); background: var(--option-wrong); }
	.option.wrong .key { background: var(--bad); color: #fff; }
	.submit-row { display: flex; justify-content: flex-end; margin-top: 16px; }
	.submit-row[hidden] { display: none; }

	.chapter-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
	.chapter-head h1 { margin: 0; }
	.fav {
		width: 32px; height: 32px; flex: 0 0 auto; display: grid; place-items: center;
		padding: 0; border: 1px solid var(--line); border-radius: 9px;
		background: var(--card); color: var(--muted); cursor: pointer;
	}
	.fav:hover { color: var(--warn); border-color: var(--hover-line); }
	.fav svg { width: 16px; height: 16px; }
	.fav.on { color: var(--warn); border-color: var(--warn); background: var(--soft); }
	.fav.on svg { fill: currentColor; }

	.feedback { margin-top: 18px; padding: 16px; border-radius: 12px; border: 2px solid var(--line); background: var(--soft-bg); font-size: 14px; line-height: 1.8; animation: rise 0.2s ease; }
	.feedback.ok { border-color: var(--ok-border); background: var(--ok-bg); }
	.feedback.bad { border-color: var(--bad-border); background: var(--bad-bg); }
	.feedback .verdict { font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
	.feedback .verdict svg { width: 17px; height: 17px; }
	.feedback.ok .verdict { color: var(--primary-dark); }
	.feedback.bad .verdict { color: var(--bad); }
	.feedback .save { color: var(--muted); font-size: 12px; margin-top: 8px; display: flex; align-items: center; gap: 5px; }
	.feedback .save svg { width: 13px; height: 13px; }

	.actions { display: flex; gap: 12px; margin-top: 18px; }
	.actions .btn { flex: 1; }

	.ai { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 14px; background: var(--ai-bg); border: 1px solid var(--ai-border); border-radius: 12px; font-size: 13px; }
	.ai .avatar { width: 32px; height: 32px; border-radius: 9px; flex: 0 0 auto; background: #6366f1; color: #fff; display: grid; place-items: center; }
	.ai .avatar svg { width: 18px; height: 18px; }
	.ai .bar { flex: 1; height: 6px; border-radius: 999px; background: var(--ai-track); overflow: hidden; }
	.ai .bar i { display: block; height: 100%; width: 0%; background: var(--blue); transition: width 0.2s linear; }
	.ai .state { color: var(--muted); min-width: 74px; text-align: right; font-variant-numeric: tabular-nums; }

	.result-score { font-size: 52px; font-weight: 800; text-align: center; line-height: 1.1; margin: 8px 0 6px; color: var(--primary); }
	.result-sub { text-align: center; color: var(--muted); margin-bottom: 22px; font-size: 14px; line-height: 1.8; }
	.section-title { font-size: 14px; color: var(--muted); font-weight: 600; margin: 24px 0 10px; }

	.review { display: grid; gap: 10px; }
	.review .item { padding: 12px 14px; border-radius: 10px; background: var(--soft-bg); border: 1px solid var(--line); border-left: 3px solid var(--bad); font-size: 13px; line-height: 1.7; }
	.review .item b { color: var(--text); }
	.review .item .right { color: var(--primary-dark); font-weight: 600; }

	.wrong-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 20px 0 14px; }
	.wrong-head h2 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; }
	.wrong-head .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--bad); color: #fff; font-size: 12px; font-weight: 700; display: inline-grid; place-items: center; }
	.wrong-list { display: grid; gap: 10px; }
	.wrong-card { padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
	.wrong-card .q { font-size: 15px; line-height: 1.7; margin: 0 0 10px; }
	.wrong-card .line { font-size: 13px; line-height: 1.8; color: var(--muted); }
	.wrong-card .line .right { color: var(--primary-dark); font-weight: 600; }
	.wrong-card .line .yours { color: var(--bad); }
	.wrong-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; gap: 10px; }
	.wrong-card .count { font-size: 12px; color: var(--gold); }
	.foot-actions { display: flex; align-items: center; gap: 6px; }

	.empty { text-align: center; padding: 56px 24px; }

	.result-list { display: grid; gap: 8px; }
	.result-item {
		display: block; width: 100%; text-align: left; cursor: pointer;
		background: var(--card); border: 1px solid var(--line); border-radius: 11px;
		padding: 13px 15px; font: inherit; color: var(--text);
	}
	.result-item:hover { border-color: var(--blue); background: var(--result-hover); }
	.result-item .where { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
	.result-item .title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
	.result-item .snippet { font-size: 13px; color: var(--muted); line-height: 1.7; }
	.result-item mark { background: var(--mark); color: inherit; padding: 0 2px; border-radius: 3px; }

	.site-footer {
		max-width: 1080px; margin: 32px auto 0; padding: 18px 20px 8px;
		border-top: 1px solid var(--line); color: var(--muted);
		font-size: 12px; line-height: 1.9;
	}
	.site-footer p { margin: 0 0 4px; }

	.totop {
		position: fixed; right: 24px; bottom: 24px; z-index: 40;
		width: 46px; height: 46px; display: grid; place-items: center;
		border: 1px solid var(--line); border-radius: 50%;
		background: var(--card); color: var(--text); cursor: pointer;
		box-shadow: 0 4px 14px var(--shadow-lg);
		opacity: 0; visibility: hidden; transform: translateY(10px);
		transition: opacity 0.2s ease, transform 0.2s ease, visibility 0.2s;
	}
	.totop.on { opacity: 1; visibility: visible; transform: none; }
	.totop:hover { color: var(--primary-ink); border-color: var(--primary); }
	.totop:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
	.totop svg { width: 20px; height: 20px; }

	.lab-sub {
		display: flex; gap: 4px; background: var(--soft); padding: 4px;
		border-radius: 12px; width: fit-content; margin-bottom: 18px;
	}
	.lab-sub button {
		border: none; background: transparent; color: var(--muted); font: inherit; font-size: 14px;
		padding: 8px 18px; border-radius: 9px; cursor: pointer;
		display: inline-flex; align-items: center; gap: 7px;
	}
	.lab-sub button:hover { color: var(--text); }
	.lab-sub button.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px var(--shadow); font-weight: 600; }
	.lab-sub svg { width: 16px; height: 16px; }

	.lab-card { padding: 20px 22px 22px; }
	.lab-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
	.lab-bar .chips { flex: 1 1 300px; }
	.lab-status { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
	.lab-inputs { margin-bottom: 14px; }

	.wave-wrap {
		border: 1px solid var(--line); border-radius: 10px; background: var(--soft-bg);
		padding: 8px 6px; overflow-x: auto;
	}
	.wave-wrap svg { display: block; min-width: 600px; width: 100%; height: auto; }

	.kmap-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
	.kmap-head h2 { margin: 0; font-size: 18px; display: flex; align-items: center; gap: 6px; }
	.kmap-level { margin-left: auto; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
	.kmap-grid { display: grid; grid-template-columns: 44px repeat(4, 56px); gap: 6px; width: fit-content; }
	.kmap-axis { display: grid; place-items: center; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
	.kmap-cell {
		position: relative; width: 56px; height: 56px; padding: 0;
		border: 1px solid var(--line); border-radius: 8px; background: var(--card);
		color: var(--text); font: inherit; font-size: 15px; font-variant-numeric: tabular-nums;
		display: grid; place-items: center; cursor: pointer;
	}
	.kmap-cell[data-one="0"] { color: var(--info-text); background: var(--soft-bg); cursor: default; }
	.kmap-cell.sel { border-color: var(--blue); background: var(--chip-active); color: var(--link); font-weight: 700; box-shadow: inset 0 0 0 2px var(--blue); }
	.kmap-cell.covered { background: var(--ok-bg); border-color: var(--ok-border); color: var(--primary-ink); }
	.kmap-cell .tag { position: absolute; top: 2px; right: 5px; font-size: 10px; color: var(--primary-ink); }
	.kmap-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
	.kmap-foot { margin-top: 10px; min-height: 20px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
	.kmap-foot.bad { color: var(--bad); }
	.stars { display: inline-flex; gap: 2px; color: var(--warn); }
	.stars svg { width: 16px; height: 16px; fill: currentColor; }
	.stars svg.off { fill: none; opacity: 0.45; }

	@media (max-width: 460px) {
		.kmap-grid { grid-template-columns: 34px repeat(4, 46px); gap: 5px; }
		.kmap-cell { width: 46px; height: 46px; font-size: 14px; }
		.lab-card { padding: 16px 14px 18px; }
	}

	@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
	@keyframes flash { 0% { background: var(--mark); } 100% { background: transparent; } }
	.pop { animation: pop 0.28s ease; display: inline-block; }

	@media (max-width: 860px) {
		.brand { flex: 1 1 auto; }
		.tabs { order: 3; width: 100%; }
		.layout { grid-template-columns: 1fr; }
		.toc { position: static; max-height: none; }
		.reader { padding: 22px 18px 26px; }
		.tabs { width: 100%; }
		.tab { flex: 1; justify-content: center; padding: 8px 8px; }
		.stats { gap: 12px; }
		.totop { right: 16px; bottom: 16px; }
	}
</style>
</head>
<body>
<div class="topbar-wrap">
	<div class="header">
		<div class="brand">
			<span class="brandicon" role="img" aria-label="与门图标" title="与门图标">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M3 8.5h4M3 15.5h4M18 12h3"></path>
					<path d="M7 5.5h4.5a6.5 6.5 0 0 1 0 13H7z"></path>
				</svg>
			</span>
			<h1>数字逻辑辅助学习插件</h1>
		</div>
		<div class="tabs">
			<button class="tab" data-tab="learn"></button>
			<button class="tab" data-tab="quiz"></button>
			<button class="tab" data-tab="wrong"></button>
			<button class="tab" data-tab="fav"></button>
			<button class="tab" data-tab="lab"></button>
		</div>
		<button class="themebtn" id="themeToggle" type="button"></button>
	</div>
</div>

<div class="shell">
	<div id="app"></div>
	<footer class="site-footer" id="footer"></footer>
</div>

<button class="totop" id="toTop" type="button" aria-label="回到顶部"></button>

<script src="./book.js"></script>
<script src="./questions.js"></script>
<script>
(function () {
	"use strict";

	var BOOK = window.DL_BOOK || null;
	var QUIZ = window.DL_QUIZ || null;
	var ITEMS = QUIZ && Array.isArray(QUIZ.items) ? QUIZ.items : [];
	var CHAPTERS = BOOK && Array.isArray(BOOK.chapters) ? BOOK.chapters : [];
	var SOURCE = BOOK && BOOK.source ? BOOK.source : null;
	var app = document.getElementById("app");
	var footer = document.getElementById("footer");
	var STORAGE_KEY = "dl-wrong-book-v1";
	var FAV_KEY = "dl-favorites-v1";
	var APP_VERSION = "0.8.0";

	var MODULES = {
		M1: "数制与编码", M2: "逻辑代数", M3: "组合逻辑", M4: "时序逻辑",
		M5: "存储器", M6: "可编程器件", M7: "数字系统", M8: "Verilog HDL"
	};

	var AI_LEVELS = [
		{ id: 1, label: "简单", accuracy: 0.58, base: 3300, spread: 2200, points: 60 },
		{ id: 2, label: "普通", accuracy: 0.8, base: 2500, spread: 1700, points: 100 },
		{ id: 3, label: "困难", accuracy: 0.93, base: 1700, spread: 1100, points: 150 }
	];

	var ICONS = {
		learn: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>',
		quiz: '<path d="M13 2 4.5 13.5H11l-1 8.5 9-12h-6.5z"/>',
		wrong: '<path d="M9 4h6a2 2 0 0 1 2 2v14l-5-3-5 3V6a2 2 0 0 1 2-2z"/><path d="m9.5 10 5 5M14.5 10l-5 5"/>',
		search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
		chevron: '<path d="m9 6 6 6-6 6"/>',
		check: '<path d="m4 12.5 5 5L20 6.5"/>',
		cross: '<path d="M6 6l12 12M18 6 6 18"/>',
		flame: '<path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 1.5.8 2.5 2 2.5 1.5 0 2-1.5 1-4.5z"/>',
		target: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/>',
		clock: '<circle cx="12" cy="12" r="8"/><path d="M12 8v4.5l3 1.5"/>',
		trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
		refresh: '<path d="M20 11a8 8 0 1 0-2.5 6.5"/><path d="M20 4v7h-7"/>',
		ai: '<rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 3v4M9 13h.01M15 13h.01M9 17h6"/>',
		play: '<path d="M7 4.5 19 12 7 19.5z"/>',
		back: '<path d="M15 5l-7 7 7 7"/>',
		save: '<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h6V4M8 20v-6h8v6"/>',
		trophy: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M10 17h4M9 21h6"/>',
		sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/>',
		moon: '<path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8z"/>',
		ask: '<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5 20 20"/>',
		star: '<path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/>',
		up: '<path d="M12 19V5"/><path d="m5.5 11.5 6.5-6.5 6.5 6.5"/>',
		lab: '<path d="M9 3h6"/><path d="M10 3v5.6L5.4 17a3 3 0 0 0 2.7 4.5h7.8a3 3 0 0 0 2.7-4.5L14 8.6V3"/><path d="M7.4 14h9.2"/>',
		grid: '<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>'
	};

	function icon(name) {
		var body = ICONS[name] || "";
		return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + body + '</svg>';
	}

	/* ---------- 颜色 ---------- */

	var THEME_KEY = "dl-theme-v1";
	var THEME_MODES = ["system", "light", "dark"];
	var THEME_LABELS = { system: "跟随系统", light: "浅色", dark: "深色" };
	var themeMode = "system";

	function systemDark() {
		return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
	}

	function resolvedTheme(mode) {
		if (mode === "dark" || mode === "light") return mode;
		return systemDark() ? "dark" : "light";
	}

	function paintTheme(mode) {
		themeMode = mode;
		var dark = resolvedTheme(mode) === "dark";
		document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
		var button = document.getElementById("themeToggle");
		if (button === null) return;
		button.innerHTML = icon(dark ? "moon" : "sun");
		button.setAttribute("aria-label", "颜色：" + THEME_LABELS[mode] + "，点一下切换");
		button.title = "颜色：" + THEME_LABELS[mode];
	}

	function cycleTheme() {
		var resolved = resolvedTheme(themeMode);
		var next;
		if (themeMode === "system") next = resolved === "dark" ? "light" : "dark";
		else if (themeMode === "light") next = "dark";
		else next = "system";
		try {
			localStorage.setItem(THEME_KEY, next);
		} catch (error) { /* 隐私模式下只在本页生效 */ }
		paintTheme(next);
	}

	function initTheme() {
		try {
			var stored = localStorage.getItem(THEME_KEY);
			if (THEME_MODES.indexOf(stored) >= 0) themeMode = stored;
		} catch (error) { /* 用默认值 */ }
		paintTheme(themeMode);
		var button = document.getElementById("themeToggle");
		if (button !== null) button.addEventListener("click", cycleTheme);
		if (window.matchMedia) {
			var query = window.matchMedia("(prefers-color-scheme: dark)");
			var onSystemChange = function () {
				if (themeMode === "system") paintTheme("system");
			};
			if (query.addEventListener) query.addEventListener("change", onSystemChange);
			else if (query.addListener) query.addListener(onSystemChange);
		}
	}

	var TABS = [
		{ id: "learn", label: "学习", icon: "learn" },
		{ id: "quiz", label: "自测", icon: "quiz" },
		{ id: "wrong", label: "错题本", icon: "wrong" },
		{ id: "fav", label: "收藏", icon: "star" },
		{ id: "lab", label: "实验室", icon: "lab" }
	];

	var state = {
		tab: "learn",
		chapterId: CHAPTERS.length > 0 ? CHAPTERS[0].id : "",
		quizChapter: "all",
		quizMode: "solo",
		quizLevel: 2,
		quizCount: 10,
		quiz: null,
		search: "",
		openSubs: {},
		lab: "wave",
		wave: { scene: "d", d: 1, j: 1, k: 0, clr: 0, cycles: [], auto: false },
		kmap: { level: 0, selected: [], groups: [], msg: "", bad: false }
	};

	var aiTimer = null;
	var waveTimer = null;

	/* ---------- 错题本存储 ---------- */

	function loadWrong() {
		try {
			var raw = localStorage.getItem(STORAGE_KEY);
			var list = raw === null ? [] : JSON.parse(raw);
			return Array.isArray(list) ? list : [];
		} catch (error) {
			return [];
		}
	}

	function saveWrong(list) {
		try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (error) { /* 隐私模式忽略 */ }
	}

	function recordWrong(question, chosen) {
		var list = loadWrong();
		var found = list.find(function (entry) { return entry.id === question.id; });
		if (found === undefined) {
			list.unshift({
				id: question.id,
				module: question.module,
				stem: question.stem,
				options: question.options,
				answer: question.answer,
				explain: question.explain,
				chosen: chosen,
				count: 1,
				updatedAt: Date.now()
			});
		} else {
			found.chosen = chosen;
			found.count += 1;
			found.updatedAt = Date.now();
		}
		saveWrong(list);
	}

	function removeWrong(id) {
		saveWrong(loadWrong().filter(function (entry) { return entry.id !== id; }));
	}

	/* ---------- 收藏夹存储 ---------- */

	function loadFavorites() {
		try {
			var raw = localStorage.getItem(FAV_KEY);
			var list = raw === null ? [] : JSON.parse(raw);
			return Array.isArray(list) ? list : [];
		} catch (error) {
			return [];
		}
	}

	function saveFavorites(list) {
		try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); } catch (error) { /* 隐私模式忽略 */ }
	}

	function isFavorite(kind, id) {
		return loadFavorites().some(function (item) { return item.kind === kind && item.id === id; });
	}

	function toggleFavorite(entry) {
		var list = loadFavorites();
		var at = list.findIndex(function (item) { return item.kind === entry.kind && item.id === entry.id; });
		if (at >= 0) list.splice(at, 1);
		else list.unshift(entry);
		saveFavorites(list);
		updateBadge();
		return at < 0;
	}

	function toggleFavoriteQuestion(question) {
		return toggleFavorite({
			kind: "question",
			id: question.id,
			module: question.module,
			difficulty: question.difficulty,
			stem: question.stem,
			options: question.options,
			answer: question.answer,
			explain: question.explain,
			image: question.image,
			imageAlt: question.imageAlt,
			at: Date.now()
		});
	}

	function toggleFavoriteChapter(chapter) {
		return toggleFavorite({ kind: "chapter", id: chapter.id, title: chapter.title, at: Date.now() });
	}

	function updateBadge() {
		setBadge("wrongBadge", loadWrong().length);
		setBadge("favBadge", loadFavorites().length);
	}

	function setBadge(id, count) {
		var badge = document.getElementById(id);
		if (badge === null) return;
		badge.textContent = String(count);
		badge.hidden = count === 0;
	}

	/* ---------- 通用 ---------- */

	function esc(text) {
		return String(text).replace(/[&<>"]/g, function (ch) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
		});
	}

	function currentChapter() {
		return CHAPTERS.find(function (chapter) { return chapter.id === state.chapterId; }) || CHAPTERS[0];
	}

	function poolFor(chapterId) {
		if (chapterId === "all") return ITEMS.slice();
		var chapter = CHAPTERS.find(function (item) { return item.id === chapterId; });
		if (chapter === undefined) return ITEMS.slice();
		var modules = chapter.modules || [];
		if (modules.length === 0) return [];
		return ITEMS.filter(function (item) { return modules.indexOf(item.module) >= 0; });
	}

	function shuffle(list) {
		var copy = list.slice();
		for (var i = copy.length - 1; i > 0; i -= 1) {
			var j = Math.floor(Math.random() * (i + 1));
			var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
		}
		return copy;
	}

	function info(text) {
		return '<i class="info" tabindex="0" role="note" aria-label="' + esc(text) + '" data-tip="' + esc(text) + '">i</i>';
	}

	function setTab(tab) {
		if (state.quiz !== null && !state.quiz.done && tab !== "quiz") {
			if (!window.confirm("这一局还没答完，离开会中断，确定要走吗？")) return;
			stopTimers();
			state.quiz = null;
		}
		state.tab = tab;
		render();
		window.scrollTo({ top: 0, behavior: "smooth" });
	}

	function render() {
		document.querySelectorAll(".tab").forEach(function (button) {
			button.classList.toggle("active", button.getAttribute("data-tab") === state.tab);
		});
		updateBadge();
		renderFooter();
		if (state.tab !== "lab") stopWave();
		if (state.tab === "learn") renderLearn();
		else if (state.tab === "quiz") renderQuizTab();
		else if (state.tab === "fav") renderFav();
		else if (state.tab === "lab") renderLab();
		else renderWrong();
	}

	function renderFooter() {
		if (footer === null) return;
		var parts = [];
		if (SOURCE !== null) {
			parts.push("教材来源：" + esc(SOURCE.title) + "，" + esc(SOURCE.editors) + "，"
				+ esc(SOURCE.publisher) + "，" + esc(SOURCE.year) + " 年。");
			parts.push(esc(SOURCE.note));
		} else {
			parts.push("学习资料为自编内容，不是教材原文。");
		}
		if (BOOK && BOOK.generatedAt) {
			var date = new Date(BOOK.generatedAt);
			if (!isNaN(date.getTime())) {
				parts.push("数据更新：" + date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0")
					+ "-" + String(date.getDate()).padStart(2, "0") + "。");
			}
		}
		parts.push("版本 " + APP_VERSION + "。作者：刘柏铭（Liu Baiming）。");
		footer.innerHTML = parts.map(function (line) { return "<p>" + line + "</p>"; }).join("");
	}

	/* ---------- 学习 ---------- */

	function plainText(html) {
		return html.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
	}

	function highlight(text, keyword) {
		var safe = esc(text);
		if (keyword === "") return safe;
		var pattern = keyword.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
		return safe.replace(new RegExp(pattern, "gi"), function (match) { return "<mark>" + match + "</mark>"; });
	}

	function searchBook(query) {
		var keyword = query.trim().toLowerCase();
		if (keyword === "") return [];
		var results = [];
		CHAPTERS.forEach(function (chapter) {
			chapter.sections.forEach(function (section) {
				var blocks = [{ anchor: section.anchor, heading: section.heading, html: section.html, number: section.number }];
				section.subs.forEach(function (sub) {
					blocks.push({ anchor: sub.anchor, heading: sub.heading, html: sub.html, number: sub.number });
				});
				blocks.forEach(function (block) {
					var text = plainText(block.html);
					var pool = (block.heading + " " + text).toLowerCase();
					var hit = pool.indexOf(keyword);
					if (hit < 0) return;
					var at = Math.max(0, hit - 24);
					results.push({
						chapterId: chapter.id,
						chapterTitle: chapter.title,
						anchor: block.anchor,
						where: chapter.title + (block.number === "" ? "" : " · " + block.number),
						heading: block.heading,
						snippet: text.slice(at, at + 78),
						keyword: keyword
					});
				});
			});
		});
		return results.slice(0, 30);
	}

	function renderLearn() {

				+ '<button class="btn primary" id="reloadLearn">' + icon("refresh") + '重新加载</button></div>';

		app.innerHTML = '<div class="learn"><div class="searchbar">' + icon("search")
			+ '<input id="searchInput" type="search" autocomplete="off" placeholder="搜索章节、术语或正文" value="' + esc(state.search) + '" aria-label="搜索学习资料">'
			+ '</div><div id="learnMain"></div></div>';

		var input = document.getElementById("searchInput");
		input.addEventListener("input", function () {
			state.search = input.value;
			renderLearnMain();

		renderLearnMain();

	function renderLearnMain() {

		var chapter = currentChapter();

	function headingHtml(node) {
		if (!node.number) return esc(node.heading);
		return '<span class="num">' + esc(node.number) + '</span>' + esc(node.heading);
	}

	function renderToc() {
		var toc = document.getElementById("toc");
		if (toc === null) return;
		toc.innerHTML = CHAPTERS.map(function (chapter) {
			var active = chapter.id === state.chapterId;
			var html = '<button class="toc-chapter' + (active ? " active" : "") + '" data-chapter="' + chapter.id + '">'
				+ esc(chapter.title) + '</button>';
			if (!active) return html;
			html += '<div class="toc-sections">' + chapter.sections.map(function (section) {
				var key = chapter.id + "|" + section.anchor;
				if (section.subs.length === 0) {
					return '<div class="toc-sec-head"><a href="#' + section.anchor + '" data-sec="' + section.anchor + '">'
						+ headingHtml(section) + '</a></div>';
				}
				var open = state.openSubs[key] === true;
				return '<div class="toc-sec-head"><a href="#' + section.anchor + '" data-sec="' + section.anchor + '">'
					+ headingHtml(section) + '</a>'
					+ '<button class="caret' + (open ? " open" : "") + '" data-toggle="' + key + '" aria-label="展开小节" aria-expanded="' + open + '">'
					+ icon("chevron") + '</button></div>'
					+ '<div class="toc-subs"' + (open ? "" : " hidden") + '>' + section.subs.map(function (sub) {
						return '<a href="#' + sub.anchor + '" data-sec="' + sub.anchor + '">' + headingHtml(sub) + '</a>';
					}).join("") + '</div>';
			}).join("") + '</div>';
			return html;
		}).join("");

		toc.querySelectorAll("[data-chapter]").forEach(function (button) {
			button.addEventListener("click", function () {
				state.chapterId = button.getAttribute("data-chapter");
				state.openSubs = {};
				state.search = "";
				renderLearn();
				window.scrollTo({ top: 0, behavior: "smooth" });
			});
		});
		toc.querySelectorAll("[data-toggle]").forEach(function (button) {
			button.addEventListener("click", function () {
				var key = button.getAttribute("data-toggle");
				state.openSubs[key] = !(state.openSubs[key] === true);
				var pane = button.closest(".toc-sec-head").nextElementSibling;
				if (pane !== null) pane.hidden = !state.openSubs[key];
				button.classList.toggle("open", state.openSubs[key]);
				button.setAttribute("aria-expanded", String(state.openSubs[key]));
			});
		});
	}

	function openSubsFor(anchor) {
		var chapter = currentChapter();
		if (chapter === undefined) return;
		var section = chapter.sections.find(function (item) {
			return item.anchor === anchor || item.subs.some(function (sub) { return sub.anchor === anchor; });
		});
		if (section !== undefined) state.openSubs[chapter.id + "|" + section.anchor] = true;
	}

	/** 跳到任意锚点；若目标不在当前章，先切章再滚。 */
	function jumpTo(anchor) {
		if (document.getElementById(anchor) !== null) {
			scrollToAnchor(anchor, true);
			return;
		}
		var owner = CHAPTERS.find(function (chapter) {
			return chapter.sections.some(function (section) {
				return section.anchor === anchor || section.subs.some(function (sub) { return sub.anchor === anchor; });
			});
		});
		if (owner === undefined) return;
		state.chapterId = owner.id;
		state.openSubs = {};
		var section = owner.sections.find(function (item) {
			return item.anchor === anchor || item.subs.some(function (sub) { return sub.anchor === anchor; });
		});
		if (section !== undefined) state.openSubs[owner.id + "|" + section.anchor] = true;
		renderLearn();
		scrollToAnchor(anchor, true);
	}

	function scrollToAnchor(anchor, flash) {
		var target = document.getElementById(anchor);
		if (target === null) return;
		target.scrollIntoView({ behavior: "smooth", block: "start" });
		if (flash === true) {
			target.classList.remove("flash");
			void target.offsetWidth;
			target.classList.add("flash");
		}
	}

			+ [5, 10, 20].map(function (count) {

			}).join("")

	function startQuiz(count, customItems) {
		stopTimers();
		var pool = customItems !== undefined ? customItems : poolFor(state.quizChapter);
		var questions = customItems !== undefined ? pool.slice() : shuffle(pool).slice(0, count);
		state.quiz = {
			mode: state.quizMode,
			level: AI_LEVELS.find(function (item) { return item.id === state.quizLevel; }) || AI_LEVELS[1],
			questions: questions,
			index: 0,
			score: 0,
			streak: 0,
			best: 0,
			answers: [],
			locked: false,
			aiScore: 0,
			done: false,
			startedAt: Date.now()
		};
		renderQuestion();
	}

	function currentQuestion() {
		return state.quiz.questions[state.quiz.index];
	}

	function renderQuestion() {
		var quiz = state.quiz;
		var question = currentQuestion();
		if (question === undefined) { finishQuiz(); return; }
		quiz.locked = false;
		quiz.pick = null;

		var options = question.options.map(function (text, index) {
			return '<button class="option" data-index="' + index + '">'

		var aiPanel = quiz.mode === "versus"

				+ '<div class="state" id="aistate">思考中</div><div class="state">AI <b>' + quiz.aiScore + '</b></div></div>'
			: "";

		var figure = question.image === undefined || question.image === null || question.image === ""
			? ""
			: '<img class="qfig" src="' + esc(question.image) + '" alt="' + esc(question.imageAlt || "题目配图") + '" loading="lazy">';

		app.innerHTML = '<div class="quizbar">'

			+ '<div class="score">' + icon("trophy") + '<span>得分 <b id="score">' + quiz.score + '</b></span></div>'
			+ '<div>' + icon("flame") + '<span>连对 <b>' + quiz.streak + '</b></span></div></div></div>'
			+ aiPanel
			+ '<div class="panel card">'
			+ '<div class="qhead"><span class="tag">' + (MODULES[question.module] || question.module) + '</span>'
			+ '<span class="stars">' + stars + '</span>'
			+ '<button type="button" class="ask" id="askQuestion">' + icon("ask") + '<span>搜题</span></button>'
			+ '<button type="button" class="fav' + (isFavorite("question", question.id) ? " on" : "") + '" id="favQuestion"'
			+ ' aria-label="收藏题目" aria-pressed="' + isFavorite("question", question.id) + '">' + icon("star") + '</button></div>'
			+ '<p class="stem">' + esc(question.stem) + '</p>'
			+ figure
			+ '<div class="options">' + options + '</div>'
			+ '<div class="submit-row"><button class="btn primary" id="submitAnswer" disabled>' + icon("check") + '确认答案</button></div>'
			+ '<div id="feedback"></div></div>';

			button.addEventListener("click", function () { selectOption(Number(button.getAttribute("data-index"))); });

			var on = toggleFavoriteQuestion(question);
			favQuestion.classList.toggle("on", on);
			favQuestion.setAttribute("aria-pressed", String(on));
		});

	function selectOption(index) {
		var quiz = state.quiz;
		if (quiz === null || quiz.locked) return;
		quiz.pick = index;
		app.querySelectorAll(".option").forEach(function (button, at) {
			button.classList.toggle("picked", at === index);
			button.setAttribute("aria-pressed", String(at === index));
		});
		var submit = document.getElementById("submitAnswer");
		if (submit !== null) submit.disabled = false;
	}

	/* ---------- 搜题：把题干交给对话里的数字逻辑技能 ---------- */

	function showToast(text) {
		var toast = document.createElement("div");
		toast.className = "toast";
		toast.textContent = text;
		document.body.appendChild(toast);
		setTimeout(function () { toast.remove(); }, 2400);
	}

	function copyPlain(text) {
		var area = document.createElement("textarea");
		area.value = text;
		area.setAttribute("readonly", "");
		area.style.position = "fixed";
		area.style.opacity = "0";
		document.body.appendChild(area);
		area.select();
		var ok = false;
		try { ok = document.execCommand("copy"); } catch (error) { ok = false; }
		area.remove();
		return ok;
	}

	function askText(question) {
		var parts = ["/digital-logic-lectern 请讲解这道题：", question.stem];
		question.options.forEach(function (text, index) { parts.push("ABCD"[index] + "．" + text); });
		if (question.imageAlt) parts.push("配图说明：" + question.imageAlt);
		return parts.join("\n");
	}

	function askQuestion() {
		var question = currentQuestion();
		if (question === undefined) return;
		var text = askText(question);
		var host = null;
		try { host = window.parent !== window ? window.parent : null; } catch (error) { host = null; }
		if (host !== null && typeof host.__DLL_ASK__ === "function") {
			try {
				if (host.__DLL_ASK__(text)) return;
			} catch (error) {
				// 宿主拒绝时退回复制。
			}
		}
		showToast(copyPlain(text) ? "题干已复制，粘贴到对话框即可" : "复制失败，请手动选中题干");
	}

	function scheduleAI(question) {
		clearTimeout(aiTimer);
		var level = state.quiz.level || AI_LEVELS[1];
		var delay = Math.max(900, level.base + Math.random() * level.spread - question.difficulty * 160);
		var startedAt = Date.now();
		var interval = setInterval(function () {
			var bar = document.getElementById("aibar");
			if (bar === null || !document.body.contains(bar)) { clearInterval(interval); return; }
			bar.style.width = (Math.min(1, (Date.now() - startedAt) / delay) * 100).toFixed(0) + "%";
		}, 60);
		aiTimer = setTimeout(function () {
			clearInterval(interval);
			var quiz = state.quiz;
			if (quiz === null || quiz.locked) return;
			var accuracy = Math.min(0.97, level.accuracy - question.difficulty * 0.04);
			var correct = Math.random() < accuracy;
			var label = document.getElementById("aistate");
			if (label !== null) label.textContent = correct ? "已抢答" : "答错了";
			var chosen = correct ? question.answer : (question.answer + 1 + Math.floor(Math.random() * 3)) % 4;
			reveal(chosen, correct);
			if (correct) quiz.aiScore += level.points;
			quiz.locked = true;
			showFeedback(correct, "AI 抢先答" + (correct ? "对了" : "错了") + "，这题归它。", false);
		}, delay);
	}

	function answer(index) {
		var quiz = state.quiz;
		if (quiz === null || quiz.locked) return;
		var question = currentQuestion();
		var correct = index === question.answer;
		quiz.locked = true;
		clearTimeout(aiTimer);
		reveal(index, correct);

		if (correct) {
			var bonus = Math.min(50, quiz.streak * 15);
			quiz.score += 100 + bonus;
			quiz.streak += 1;
			quiz.best = Math.max(quiz.best, quiz.streak);
			showFeedback(true, "答对了，+" + (100 + bonus) + " 分" + (bonus > 0 ? "（连对加成 " + bonus + "）" : "") + "。", false);
		} else {
			quiz.streak = 0;
			quiz.score = Math.max(0, quiz.score - 20);
			recordWrong(question, index);
			updateBadge();
			showFeedback(false, "答错了，扣 20 分。", true);
		}

		quiz.answers.push({ question: question, chosen: index, correct: correct });
		var score = document.getElementById("score");
		if (score !== null) {
			score.textContent = quiz.score;
			score.classList.remove("pop");
			void score.offsetWidth;
			score.classList.add("pop");
		}
	}

	function reveal(chosen, correct) {
		var question = currentQuestion();
		app.querySelectorAll(".option").forEach(function (button, index) {
			button.disabled = true;
			button.classList.remove("picked");
			if (index === question.answer) button.classList.add("correct");
			if (index === chosen && !correct) button.classList.add("wrong");
		});
		var submit = document.getElementById("submitAnswer");
		if (submit !== null) {
			submit.disabled = true;
			var row = submit.closest(".submit-row");
			if (row !== null) row.hidden = true;
		}
	}

		next.addEventListener("click", nextQuestion);

		var quiz = state.quiz;

			+ '<div class="result-sub">答对 ' + right + ' / ' + answered + '，正确率 ' + accuracy + '%，最长连对 ' + quiz.best

	/* ---------- 实验室 ---------- */

	var WAVE_SCENES = [

	var KMAP_ORDER = [0, 1, 3, 2];

	var KMAP_LEVELS = [
		{ groups: [[[0, 0], [0, 1], [1, 0], [1, 1]]] },
		{ groups: [[[0, 0], [0, 1]], [[2, 2], [2, 3]]] },

	/* ---------- 波形实验室 ---------- */

	function waveCurrent(wave) {
		if (wave.cycles.length === 0) return wave.scene === "cnt" ? { n: 0 } : { q: 0 };
		return wave.cycles[wave.cycles.length - 1].after;
	}

	function waveAfter(wave, current) {
		if (wave.scene === "d") return { q: wave.d };
		if (wave.scene === "jk") {
			if (wave.j && wave.k) return { q: current.q ? 0 : 1 };
			if (wave.j) return { q: 1 };
			if (wave.k) return { q: 0 };
			return { q: current.q };
		}
		return { n: wave.clr ? 0 : (current.n + 1) % 16 };
	}

	function waveStep() {
		var wave = state.wave;
		var current = waveCurrent(wave);
		wave.cycles.push({
			before: current,
			after: waveAfter(wave, current),
			inputs: { d: wave.d, j: wave.j, k: wave.k, clr: wave.clr }
		});
		if (wave.cycles.length > 24) wave.cycles.splice(0, wave.cycles.length - 24);
	}

	function stopWave() {
		if (waveTimer !== null) {
			clearInterval(waveTimer);
			waveTimer = null;
		}
		state.wave.auto = false;
	}

	function waveLanes(wave) {
		var bit = function (index) {
			return function (cycle, high) {
				var n = high ? cycle.after.n : cycle.before.n;
				return (n >> index) & 1;
			};
		};
		if (wave.scene === "d") {
			return [
				{ label: "D", kind: "in", value: function (cycle) { return cycle.inputs.d; } },
				{ label: "CLK", kind: "clk", value: function (cycle, high) { return high; } },
				{ label: "Q", kind: "out", value: function (cycle, high) { return high ? cycle.after.q : cycle.before.q; } },
				{ label: "Q\u0305", kind: "out", value: function (cycle, high) { return high ? (cycle.after.q ? 0 : 1) : (cycle.before.q ? 0 : 1); } }
			];
		}
		if (wave.scene === "jk") {
			return [
				{ label: "J", kind: "in", value: function (cycle) { return cycle.inputs.j; } },
				{ label: "K", kind: "in", value: function (cycle) { return cycle.inputs.k; } },
				{ label: "CLK", kind: "clk", value: function (cycle, high) { return high; } },
				{ label: "Q", kind: "out", value: function (cycle, high) { return high ? cycle.after.q : cycle.before.q; } }
			];
		}
		return [
			{ label: "CLR", kind: "in", value: function (cycle) { return cycle.inputs.clr; } },
			{ label: "CLK", kind: "clk", value: function (cycle, high) { return high; } },
			{ label: "Q3", kind: "out", value: bit(3) },
			{ label: "Q2", kind: "out", value: bit(2) },
			{ label: "Q1", kind: "out", value: bit(1) },
			{ label: "Q0", kind: "out", value: bit(0) }
		];
	}

	function waveSvg(wave) {
		var lanes = waveLanes(wave);
		var visible = wave.cycles.slice(-10);
		var span = Math.max(visible.length, 6);
		var labelWidth = 54;
		var slotWidth = 24;
		var laneHeight = 32;
		var width = labelWidth + span * slotWidth * 2 + 10;
		var height = lanes.length * laneHeight + 16;
		var parts = [];
		var colors = { in: "var(--gold)", clk: "var(--blue)", out: "var(--primary)" };
		var index;
		for (index = 0; index <= span; index++) {
			var gx = labelWidth + index * slotWidth * 2;
			parts.push('<line x1="' + gx + '" y1="6" x2="' + gx + '" y2="' + (height - 6) + '" stroke="var(--line)" opacity="0.7"/>');
		}
		lanes.forEach(function (lane, laneIndex) {
			var top = 8 + laneIndex * laneHeight;
			var high = top + 6;
			var low = top + 22;
			parts.push('<text x="6" y="' + (top + 19) + '" font-size="11" fill="var(--muted)">' + lane.label + '</text>');
			if (visible.length === 0) {
				parts.push('<line x1="' + labelWidth + '" y1="' + low + '" x2="' + (width - 10) + '" y2="' + low
					+ '" stroke="var(--muted)" stroke-dasharray="3 4" opacity="0.45"/>');
				return;
			}
			var path = "";
			var x = labelWidth;
			visible.forEach(function (cycle) {
				var slot;
				for (slot = 0; slot < 2; slot++) {
					var y = lane.value(cycle, slot) ? high : low;
					if (path === "") path = "M" + x + " " + y;
					else path += "V" + y;
					x += slotWidth;
					path += "H" + x;
				}
			});
			parts.push('<path d="' + path + '" fill="none" stroke="' + colors[lane.kind] + '" stroke-width="2" stroke-linejoin="round"/>');
		});
		return '<svg viewBox="0 0 ' + width + ' ' + height + '" role="img" aria-label="时序波形">' + parts.join("") + '</svg>';
	}

	function waveStatus(wave) {
		var current = waveCurrent(wave);
		if (wave.scene === "cnt") {
			var bits = "";
			for (var i = 3; i >= 0; i--) bits += String((current.n >> i) & 1);
			return "Q3Q2Q1Q0 = " + bits + " · 十进制 " + current.n;
		}
		return "Q = " + current.q + " · Q̄ = " + (current.q ? 0 : 1);
	}

		body.querySelectorAll("[data-wave-scene]").forEach(function (button) {

		body.querySelectorAll("[data-wave-input]").forEach(function (button) {

				stopWave();

				return;
			}
			wave.auto = true;
			waveTimer = setInterval(function () {
				if (state.tab !== "lab" || state.lab !== "wave") {
					stopWave();
					return;
				}
				waveStep();
				renderWave();
			}, 900);
			renderWave();
		});
		document.getElementById("waveReset").addEventListener("click", function () {
			stopWave();
			wave.cycles = [];
			renderWave();
		});
	}

	/* ---------- 卡诺图消消乐 ---------- */

	function kmapMinterm(row, col) {
		return KMAP_ORDER[row] * 4 + KMAP_ORDER[col];
	}

	function kmapOnes(level) {
		var mask = 0;
		level.groups.forEach(function (group) {
			group.forEach(function (cell) {
				mask |= 1 << kmapMinterm(cell[0], cell[1]);
			});
		});
		return mask;
	}

	function kmapRuns() {
		var runs = [];
		[1, 2, 4].forEach(function (length) {
			for (var start = 0; start < 4; start++) {
				var run = [];
				for (var i = 0; i < length; i++) run.push((start + i) % 4);
				runs.push(run);
			}
		});
		return runs;
	}

	function kmapCyclicRun(values) {
		if (values.length === 1 || values.length === 4) return true;
		var sorted = values.slice().sort(function (a, b) { return a - b; });
		var breaks = 0;
		for (var i = 0; i < sorted.length; i++) {
			var next = sorted[(i + 1) % sorted.length];
			if ((next - sorted[i] + 4) % 4 !== 1) breaks++;
		}
		return breaks === 1;
	}

	function kmapMinimum(ones) {
		if (ones === 0) return 0;
		var runs = kmapRuns();
		var candidates = [];
		runs.forEach(function (rows) {
			runs.forEach(function (cols) {
				var mask = 0;
				rows.forEach(function (row) {
					cols.forEach(function (col) { mask |= 1 << kmapMinterm(row, col); });
				});
				if ((mask & ones) === mask) candidates.push(mask);
			});
		});
		var memo = {};
		function solve(mask) {
			if (mask === 0) return 0;
			if (memo[mask] !== undefined) return memo[mask];
			var first = mask & -mask;
			var best = 99;
			candidates.forEach(function (group) {
				if ((group & first) === 0) return;
				if ((group & mask) !== group) return;
				var rest = solve(mask ^ group) + 1;
				if (rest < best) best = rest;
			});
			memo[mask] = best;
			return best;
		}
		return solve(ones);
	}

	function kmapCheck(kmapState, ones) {
		var cells = kmapState.selected;
		if (cells.length === 0) return "先点选格子";
		if ([1, 2, 4, 8, 16].indexOf(cells.length) === -1) return "每组只能是 1、2、4、8、16 格";
		var rows = [];
		var cols = [];
		for (var i = 0; i < cells.length; i++) {
			var pair = cells[i].split(",");
			var row = Number(pair[0]);
			var col = Number(pair[1]);
			if ((ones & (1 << kmapMinterm(row, col))) === 0) return "0 不能圈进来";
			if (rows.indexOf(row) === -1) rows.push(row);
			if (cols.indexOf(col) === -1) cols.push(col);
		}
		if (rows.length * cols.length !== cells.length) return "要圈成长方形";
		if (!kmapCyclicRun(rows) || !kmapCyclicRun(cols)) return "要圈成长方形";
		return "";
	}

	function kmapPad(value) {
		return (value < 2 ? "0" : "1") + (value % 2);
	}

	function renderKmap() {
		var body = document.getElementById("labBody");
		if (body === null) return;
		var kmapState = state.kmap;
		var level = KMAP_LEVELS[kmapState.level];
		var ones = kmapOnes(level);
		var covered = 0;
		kmapState.groups.forEach(function (group) {
			group.forEach(function (cell) {
				covered |= 1 << kmapMinterm(cell[0], cell[1]);
			});
		});
		var total = 0;
		var left = 0;
		var m;
		for (m = 0; m < 16; m++) {
			if ((ones >> m) & 1) {
				total++;
				if (((covered >> m) & 1) === 0) left++;
			}
		}
		var done = total > 0 && left === 0;
		var tagOf = {};
		kmapState.groups.forEach(function (group, index) {
			group.forEach(function (cell) { tagOf[cell[0] + "," + cell[1]] = index + 1; });
		});

		var head = '<div class="kmap-axis"></div>';
		KMAP_ORDER.forEach(function (value) { head += '<div class="kmap-axis">' + kmapPad(value) + '</div>'; });

		var cells = "";
		for (var row = 0; row < 4; row++) {
			cells += '<div class="kmap-axis">' + kmapPad(KMAP_ORDER[row]) + '</div>';
			for (var col = 0; col < 4; col++) {
				var key = row + "," + col;
				var minterm = kmapMinterm(row, col);
				var one = (ones >> minterm) & 1;
				var coveredOne = (covered >> minterm) & 1;
				var classes = "kmap-cell";
				if (kmapState.selected.indexOf(key) !== -1) classes += " sel";
				if (coveredOne) classes += " covered";
				cells += '<button type="button" class="' + classes + '" data-kmap-cell="' + key + '" data-one="' + one + '">'
					+ (one ? "1" : "0") + (tagOf[key] ? '<span class="tag">' + tagOf[key] + '</span>' : "") + '</button>';
			}
		}

		var foot = "";
		if (done) {
			var minimum = kmapMinimum(ones);
			var stars = kmapState.groups.length <= minimum ? 3 : (kmapState.groups.length <= minimum + 1 ? 2 : 1);
			var starHtml = "";
			for (var s = 0; s < 3; s++) {
				starHtml += s < stars ? icon("star") : '<svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.6 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.8-5.2 2.8 1-5.8L3.6 9.7l5.8-.8z"/></svg>';
			}
			foot = '<span>全部圈完，最少 ' + minimum + ' 组</span><span class="stars" aria-label="' + stars + ' 星">' + starHtml + '</span>';
		} else if (kmapState.msg !== "") {
			foot = '<span>' + esc(kmapState.msg) + '</span>';
		}

		body.innerHTML = '<section class="panel lab-card">'
			+ '<div class="kmap-head"><h2>卡诺图消消乐' + info("行与列的首尾相接：上下相邻、左右相邻、跨过边界的 1 都能圈成一组。每组只能是长方形，格数为 1、2、4、8、16。") + '</h2>'
			+ '<span class="kmap-level">第 ' + (kmapState.level + 1) + ' / ' + KMAP_LEVELS.length + ' 关 · 还剩 ' + left + ' 格</span></div>'
			+ '<div class="kmap-grid">' + head + cells + '</div>'
			+ '<div class="kmap-actions">'
			+ '<button type="button" class="btn primary" id="kmapCommit"' + (done || kmapState.selected.length === 0 ? " disabled" : "") + '>' + icon("check") + '圈定</button>'
			+ '<button type="button" class="btn" id="kmapClearSel"' + (kmapState.selected.length === 0 ? " disabled" : "") + '>重选</button>'
			+ '<button type="button" class="btn" id="kmapNext">' + icon("refresh") + (done ? "下一关" : "换一题") + '</button></div>'
			+ '<div class="kmap-foot' + (kmapState.bad ? " bad" : "") + '">' + foot + '</div>'
			+ '</section>';

		body.querySelectorAll("[data-kmap-cell]").forEach(function (button) {
			button.addEventListener("click", function () {
				if (button.getAttribute("data-one") === "0") return;
				if (button.classList.contains("covered")) return;
				var key = button.getAttribute("data-kmap-cell");
				var at = kmapState.selected.indexOf(key);
				if (at === -1) kmapState.selected.push(key);
				else kmapState.selected.splice(at, 1);
				kmapState.msg = "";
				kmapState.bad = false;
				renderKmap();
			});
		});
		document.getElementById("kmapCommit").addEventListener("click", function () {
			var error = kmapCheck(kmapState, ones);
			if (error !== "") {
				kmapState.msg = error;
				kmapState.bad = true;
				renderKmap();
				return;
			}
			var group = kmapState.selected.map(function (key) {
				var pair = key.split(",");
				return [Number(pair[0]), Number(pair[1])];
			});
			kmapState.groups.push(group);
			kmapState.selected = [];
			kmapState.msg = "圈定 " + group.length + " 格";
			kmapState.bad = false;
			renderKmap();
		});
		document.getElementById("kmapClearSel").addEventListener("click", function () {
			kmapState.selected = [];
			kmapState.msg = "";
			kmapState.bad = false;
			renderKmap();
		});
		document.getElementById("kmapNext").addEventListener("click", function () {
			kmapState.level = (kmapState.level + 1) % KMAP_LEVELS.length;
			kmapState.selected = [];
			kmapState.groups = [];
			kmapState.msg = "";
			kmapState.bad = false;
			renderKmap();
		});
	}

	function stopTimers() {
		clearTimeout(aiTimer);
		stopWave();
	}

	/* ---------- 启动 ---------- */

	/** 读取插件行里设定的默认难度；独立打开页面时读不到就用普通。 */
	function applyHostOptions() {
		try {
			var raw = localStorage.getItem("dll-options");
			var options = raw === null ? null : JSON.parse(raw);
			if (options === null || typeof options.level !== "number") return;
			if (AI_LEVELS.some(function (item) { return item.id === options.level; })) {
				state.quizLevel = options.level;
			}
		} catch (error) { /* 忽略损坏的配置 */ }
	}

	function renderTabs() {
		document.querySelectorAll(".tab").forEach(function (button) {
			var meta = TABS.find(function (item) { return item.id === button.getAttribute("data-tab"); });
			if (meta === undefined) return;
			var label = meta.label;
			var badgeId = meta.id === "wrong" ? "wrongBadge" : meta.id === "fav" ? "favBadge" : "";
			var extra = badgeId === "" ? "" : '<span class="badge" id="' + badgeId + '" hidden>0</span>';
			button.innerHTML = icon(meta.icon) + '<span>' + label + '</span>' + extra;
			button.setAttribute("aria-label", label);
			button.addEventListener("click", function () { setTab(meta.id); });
		});
	}

	document.addEventListener("click", function (event) {
		var link = event.target !== null && event.target.closest ? event.target.closest("[data-sec]") : null;
		if (link === null) return;
		event.preventDefault();
		jumpTo(link.getAttribute("data-sec"));
	});

	document.addEventListener("keydown", function (event) {
		if (state.tab !== "quiz" || state.quiz === null || state.quiz.done) return;
		if (event.key >= "1" && event.key <= "4" && !state.quiz.locked) {
			selectOption(Number(event.key) - 1);
			return;
		}
		if (event.key === "Enter") {
			var next = document.getElementById("next");
			if (next !== null) { event.preventDefault(); next.click(); return; }
			var submit = document.getElementById("submitAnswer");
			if (submit !== null && !submit.disabled) { event.preventDefault(); submit.click(); }
		}
	});

	var toTop = document.getElementById("toTop");
	var topbar = document.querySelector(".topbar-wrap");

	function syncTopbarHeight() {
		if (topbar === null) return;
		document.documentElement.style.setProperty("--topbar-h", topbar.offsetHeight + "px");
	}

	function syncToTop() {
		if (toTop === null) return;
		toTop.classList.toggle("on", window.scrollY > 360);
	}

	if (toTop !== null) {
		toTop.innerHTML = icon("up");
		toTop.addEventListener("click", function () {
			var reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
			window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
		});
	}
	window.addEventListener("scroll", function () {
		window.requestAnimationFrame(syncToTop);
	}, { passive: true });
	window.addEventListener("resize", syncTopbarHeight);
	if (typeof ResizeObserver !== "undefined" && topbar !== null) {
		new ResizeObserver(syncTopbarHeight).observe(topbar);
	}
	syncTopbarHeight();
	syncToTop();

	initTheme();
	applyHostOptions();
	renderTabs();
	updateBadge();
	render();
})();
</script>
</body>
</html>
