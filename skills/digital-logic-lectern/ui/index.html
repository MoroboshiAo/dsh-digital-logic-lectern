<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字逻辑讲台</title>
<style>
	:root {
		--bg: #0b1220;
		--panel: #141d2f;
		--panel-2: #1b2740;
		--line: #2a3a57;
		--text: #e8eefc;
		--muted: #94a7c6;
		--accent: #22d3ee;
		--accent-2: #a78bfa;
		--ok: #34d399;
		--bad: #f87171;
		--warn: #fbbf24;
	}

	* { box-sizing: border-box; }

	body {
		margin: 0;
		min-height: 100vh;
		background:
			radial-gradient(1200px 600px at 15% -10%, rgba(34, 211, 238, 0.14), transparent 60%),
			radial-gradient(900px 500px at 95% 10%, rgba(167, 139, 250, 0.12), transparent 55%),
			var(--bg);
		color: var(--text);
		font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
		-webkit-font-smoothing: antialiased;
	}

	.shell { max-width: 1080px; margin: 0 auto; padding: 26px 20px 72px; }

	.header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
	.brand { display: flex; align-items: center; gap: 12px; }
	.logo {
		width: 40px; height: 40px; border-radius: 12px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
		display: grid; place-items: center; font-weight: 800; color: #06121f; font-size: 18px;
		box-shadow: 0 8px 24px rgba(34, 211, 238, 0.28);
	}
	h1 { font-size: 22px; margin: 0; }
	.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }

	.tabs { display: flex; gap: 6px; background: rgba(20, 29, 47, 0.8); padding: 5px; border-radius: 12px; border: 1px solid var(--line); }
	.tab {
		border: none; background: transparent; color: var(--muted);
		padding: 9px 16px; border-radius: 9px; cursor: pointer;
		font: inherit; font-size: 14px; display: inline-flex; align-items: center; gap: 7px;
		transition: background 0.15s ease, color 0.15s ease;
	}
	.tab:hover { color: var(--text); }
	.tab.active { background: linear-gradient(135deg, rgba(34, 211, 238, 0.2), rgba(167, 139, 250, 0.2)); color: var(--text); }
	.tab .badge {
		min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
		background: var(--bad); color: #2b0a0a; font-size: 11px; font-weight: 700;
		display: inline-grid; place-items: center;
	}
	.tab .badge[hidden] { display: none; }

	.layout { display: grid; grid-template-columns: 268px 1fr; gap: 16px; align-items: start; }

	.panel {
		background: linear-gradient(180deg, var(--panel), var(--panel-2));
		border: 1px solid var(--line);
		border-radius: 16px;
	}

	.toc { padding: 10px; position: sticky; top: 16px; }
	.toc-item {
		display: block; width: 100%; text-align: left; border: 1px solid transparent;
		background: transparent; color: var(--text); font: inherit; cursor: pointer;
		padding: 11px 12px; border-radius: 10px; margin-bottom: 4px;
	}
	.toc-item:hover { background: rgba(11, 18, 32, 0.55); }
	.toc-item.active { border-color: rgba(34, 211, 238, 0.45); background: rgba(34, 211, 238, 0.09); }
	.toc-item b { display: block; font-size: 14px; font-weight: 600; }
	.toc-item span { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; line-height: 1.5; }
	.toc-item .mod { color: var(--accent); font-size: 11px; letter-spacing: 0.5px; }

	.reader { padding: 26px 30px 34px; }
	.reader h1 { font-size: 24px; margin: 0 0 6px; }
	.reader .lede { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
	.reader h2 {
		font-size: 16px; margin: 26px 0 10px; padding-left: 10px;
		border-left: 3px solid var(--accent); color: var(--text);
	}
	.reader p { line-height: 1.9; margin: 0 0 12px; color: #d7e1f5; }
	.reader ul, .reader ol { margin: 0 0 14px; padding-left: 22px; line-height: 1.9; color: #d7e1f5; }
	.reader li { margin-bottom: 5px; }
	.reader code {
		background: rgba(11, 18, 32, 0.9); border: 1px solid var(--line);
		padding: 1px 6px; border-radius: 5px; font-size: 13px; color: var(--accent);
	}
	.reader pre {
		background: #0a101c; border: 1px solid var(--line); border-radius: 10px;
		padding: 14px 16px; overflow-x: auto; margin: 0 0 14px;
	}
	.reader pre code { background: none; border: none; padding: 0; color: #cfe3ff; line-height: 1.7; }
	.table-wrap { overflow-x: auto; margin-bottom: 16px; }
	.reader table { border-collapse: collapse; width: 100%; font-size: 13px; }
	.reader th, .reader td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; line-height: 1.6; }
	.reader th { background: rgba(34, 211, 238, 0.08); color: var(--accent); font-weight: 600; }

	.chapter-actions { display: flex; gap: 10px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }

	.btn {
		padding: 12px 18px; border-radius: 11px; border: 1px solid var(--line);
		background: rgba(11, 18, 32, 0.6); color: var(--text);
		font: inherit; font-size: 14px; cursor: pointer;
		transition: border-color 0.12s ease, background 0.12s ease;
	}
	.btn:hover { border-color: var(--accent); }
	.btn.primary { background: linear-gradient(135deg, var(--accent), #38bdf8); border: none; color: #06121f; font-weight: 700; }
	.btn.primary:hover { filter: brightness(1.08); }
	.btn.ghost { background: transparent; }
	.btn.danger { border-color: rgba(248, 113, 113, 0.5); color: var(--bad); }
	.btn:disabled { opacity: 0.45; cursor: not-allowed; }

	.setup { padding: 24px; }
	.setup h2 { font-size: 17px; margin: 0 0 6px; }
	.setup .hint { color: var(--muted); font-size: 13px; margin: 0 0 22px; line-height: 1.7; }
	.field { margin-bottom: 22px; }
	.field > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.3px; }
	.chips { display: flex; flex-wrap: wrap; gap: 8px; }
	.chip {
		padding: 8px 13px; border-radius: 999px; font-size: 13px; cursor: pointer;
		border: 1px solid var(--line); background: rgba(11, 18, 32, 0.5); color: var(--muted);
		font-family: inherit;
	}
	.chip:hover { border-color: var(--accent); color: var(--text); }
	.chip.active { border-color: var(--accent); background: rgba(34, 211, 238, 0.14); color: var(--text); }

	.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
	.stats { display: flex; gap: 18px; font-size: 13px; color: var(--muted); }
	.stats b { color: var(--text); font-size: 16px; font-variant-numeric: tabular-nums; }
	.stats .score b { color: var(--warn); }

	.card { padding: 24px; }
	.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
	.tag {
		font-size: 11px; padding: 4px 9px; border-radius: 6px;
		background: rgba(167, 139, 250, 0.14); color: var(--accent-2);
		border: 1px solid rgba(167, 139, 250, 0.3);
	}
	.stars { color: var(--warn); font-size: 12px; letter-spacing: 2px; }
	.stem { font-size: 19px; line-height: 1.75; margin: 0 0 20px; }

	.options { display: grid; gap: 10px; }
	.option {
		display: flex; align-items: center; gap: 12px; padding: 14px 16px;
		background: rgba(11, 18, 32, 0.6); border: 1px solid var(--line);
		border-radius: 12px; color: var(--text); font: inherit; font-size: 16px;
		cursor: pointer; text-align: left;
		transition: border-color 0.12s ease, transform 0.12s ease;
	}
	.option:hover:not(:disabled) { border-color: var(--accent); transform: translateX(3px); }
	.option:disabled { cursor: default; }
	.key {
		width: 26px; height: 26px; border-radius: 8px; flex: 0 0 auto;
		display: grid; place-items: center; background: rgba(148, 167, 198, 0.14);
		color: var(--muted); font-size: 13px; font-weight: 700;
	}
	.option.correct { border-color: var(--ok); background: rgba(52, 211, 153, 0.12); }
	.option.correct .key { background: var(--ok); color: #06281c; }
	.option.wrong { border-color: var(--bad); background: rgba(248, 113, 113, 0.1); }
	.option.wrong .key { background: var(--bad); color: #2b0a0a; }

	.feedback { margin-top: 18px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: rgba(11, 18, 32, 0.55); font-size: 14px; line-height: 1.8; animation: rise 0.22s ease; }
	.feedback.ok { border-color: rgba(52, 211, 153, 0.45); }
	.feedback.bad { border-color: rgba(248, 113, 113, 0.45); }
	.feedback .verdict { font-weight: 700; margin-bottom: 6px; }
	.feedback.ok .verdict { color: var(--ok); }
	.feedback.bad .verdict { color: var(--bad); }
	.feedback .save { color: var(--muted); font-size: 12px; margin-top: 8px; }

	.actions { display: flex; gap: 12px; margin-top: 18px; }
	.actions .btn { flex: 1; }

	.ai { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; padding: 12px 14px; background: rgba(167, 139, 250, 0.08); border: 1px solid rgba(167, 139, 250, 0.25); border-radius: 12px; font-size: 13px; }
	.ai .avatar { width: 32px; height: 32px; border-radius: 10px; flex: 0 0 auto; background: linear-gradient(135deg, var(--accent-2), #6366f1); display: grid; place-items: center; font-size: 15px; }
	.ai .bar { flex: 1; height: 6px; border-radius: 999px; background: rgba(148, 167, 198, 0.18); overflow: hidden; }
	.ai .bar i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.2s linear; }
	.ai .state { color: var(--muted); min-width: 84px; text-align: right; font-variant-numeric: tabular-nums; }

	.result-score {
		font-size: 54px; font-weight: 800; text-align: center; line-height: 1.1; margin: 8px 0 4px;
		background: linear-gradient(135deg, var(--accent), var(--accent-2));
		-webkit-background-clip: text; background-clip: text; color: transparent;
	}
	.result-sub { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: 14px; }

	.section-title { font-size: 14px; color: var(--muted); font-weight: 600; margin: 22px 0 10px; letter-spacing: 0.5px; }

	.review { display: grid; gap: 10px; }
	.review .item { padding: 12px 14px; border-radius: 10px; background: rgba(11, 18, 32, 0.55); border-left: 3px solid var(--bad); font-size: 13px; line-height: 1.7; }
	.review .item b { color: var(--text); }
	.review .item .right { color: var(--ok); }
	.review .item .yours { color: var(--bad); }

	.wrong-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
	.wrong-list { display: grid; gap: 10px; }
	.wrong-card { padding: 16px 18px; background: linear-gradient(180deg, var(--panel), var(--panel-2)); border: 1px solid var(--line); border-radius: 14px; }
	.wrong-card .q { font-size: 15px; line-height: 1.7; margin: 0 0 10px; }
	.wrong-card .line { font-size: 13px; line-height: 1.8; color: var(--muted); }
	.wrong-card .line .right { color: var(--ok); }
	.wrong-card .line .yours { color: var(--bad); }
	.wrong-card .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; gap: 10px; }
	.wrong-card .count { font-size: 12px; color: var(--warn); }

	.empty { text-align: center; padding: 52px 20px; color: var(--muted); line-height: 2; }
	.empty h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
	.empty code { display: inline-block; margin-top: 8px; padding: 8px 12px; background: rgba(11, 18, 32, 0.8); border: 1px solid var(--line); border-radius: 8px; color: var(--accent); font-size: 13px; }

	@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
	@keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.18); } 100% { transform: scale(1); } }
	.pop { animation: pop 0.3s ease; }

	@media (max-width: 860px) {
		.layout { grid-template-columns: 1fr; }
		.toc { position: static; display: flex; gap: 8px; overflow-x: auto; padding: 10px; }
		.toc-item { min-width: 180px; margin-bottom: 0; }
		.reader { padding: 20px; }
	}
</style>
</head>
<body>
<div class="shell">
	<div class="header">
		<div class="brand">
			<div class="logo">DL</div>
			<div>
				<h1>数字逻辑讲台</h1>
				<p class="sub">学一章，测一章，错的留在这儿</p>
			</div>
		</div>
		<div class="tabs">
			<button class="tab" data-tab="learn">学习</button>
			<button class="tab" data-tab="quiz">自测</button>
			<button class="tab" data-tab="wrong">错题本 <span class="badge" id="wrongBadge" hidden>0</span></button>
		</div>
	</div>
	<div id="app"></div>
</div>

<script src="./book.js"></script>
<script src="./questions.js"></script>
<script>
(function () {
	"use strict";

	var BOOK = window.DL_BOOK || null;
	var QUIZ = window.DL_QUIZ || null;
	var ITEMS = QUIZ && Array.isArray(QUIZ.items) ? QUIZ.items : [];
	var CHAPTERS = BOOK && Array.isArray(BOOK.chapters) ? BOOK.chapters : [];
	var app = document.getElementById("app");
	var badge = document.getElementById("wrongBadge");
	var STORAGE_KEY = "dl-wrong-book-v1";

	var MODULES = {
		M1: "数制与编码", M2: "逻辑代数", M3: "组合逻辑", M4: "时序逻辑",
		M5: "存储器", M6: "可编程器件", M7: "数字系统", M8: "Verilog HDL"
	};

	var state = {
		tab: "learn",
		chapterId: CHAPTERS.length > 0 ? CHAPTERS[0].id : "",
		quizChapter: "all",
		quizMode: "solo",
		quiz: null
	};

	var clock = null;
	var aiTimer = null;

	/* ---------- 错题本存储 ---------- */

	function loadWrong() {
		try {
			var raw = localStorage.getItem(STORAGE_KEY);
			var list = raw === null ? [] : JSON.parse(raw);
			return Array.isArray(list) ? list : [];
		} catch (error) {
			return [];
		}
	}

	function saveWrong(list) {
		try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (error) { /* 隐私模式下忽略 */ }
	}

	function recordWrong(question, chosen) {
		var list = loadWrong();
		var found = list.find(function (entry) { return entry.id === question.id; });
		if (found === undefined) {
			list.unshift({
				id: question.id,
				module: question.module,
				stem: question.stem,
				options: question.options,
				answer: question.answer,
				explain: question.explain,
				chosen: chosen,
				count: 1,
				updatedAt: Date.now()
			});
		} else {
			found.chosen = chosen;
			found.count += 1;
			found.updatedAt = Date.now();
		}
		saveWrong(list);
	}

	function removeWrong(id) {
		saveWrong(loadWrong().filter(function (entry) { return entry.id !== id; }));
	}

	function updateBadge() {
		var count = loadWrong().length;
		badge.textContent = String(count);
		badge.hidden = count === 0;
	}

	/* ---------- 通用 ---------- */

	function esc(text) {
		return String(text).replace(/[&<>"]/g, function (ch) {
			return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch];
		});
	}

	function currentChapter() {
		return CHAPTERS.find(function (chapter) { return chapter.id === state.chapterId; }) || CHAPTERS[0];
	}

	function poolFor(chapterId) {
		if (chapterId === "all") return ITEMS.slice();
		var chapter = CHAPTERS.find(function (item) { return item.id === chapterId; });
		if (chapter === undefined || !chapter.module) return ITEMS.slice();
		return ITEMS.filter(function (item) { return item.module === chapter.module; });
	}

	function shuffle(list) {
		var copy = list.slice();
		for (var i = copy.length - 1; i > 0; i -= 1) {
			var j = Math.floor(Math.random() * (i + 1));
			var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
		}
		return copy;
	}

	function setTab(tab) {
		if (state.quiz !== null && !state.quiz.done && tab !== "quiz") {
			if (!window.confirm("这一局还没答完，离开会中断，确定要走吗？")) return;
			stopTimers();
			state.quiz = null;
		}
		state.tab = tab;
		render();
	}

	function render() {
		document.querySelectorAll(".tab").forEach(function (button) {
			button.classList.toggle("active", button.getAttribute("data-tab") === state.tab);
		});
		updateBadge();
		if (state.tab === "learn") renderLearn();
		else if (state.tab === "quiz") renderQuizTab();
		else renderWrong();
	}

	/* ---------- 学习 ---------- */

	function renderLearn() {
		if (CHAPTERS.length === 0) {
			app.innerHTML = '<div class="panel empty"><h2>讲义还没生成</h2>'
				+ '<p>在技能目录运行下面的命令，然后刷新页面。</p>'
				+ '<code>node scripts/dlbook.js --build</code></div>';
			return;
		}
		var chapter = currentChapter();
		var toc = CHAPTERS.map(function (item) {
			var module = item.module ? '<span class="mod">' + item.module + '</span>' : '<span class="mod">附录</span>';
			return '<button class="toc-item' + (item.id === chapter.id ? " active" : "") + '" data-chapter="' + item.id + '">'
				+ module + '<b>' + esc(item.title) + '</b>'
				+ '<span>' + esc(item.hook) + '</span></button>';
		}).join("");

		var body = chapter.sections.map(function (section) {
			return '<h2>' + esc(section.heading) + '</h2>' + section.html;
		}).join("");

		var quizButton = chapter.module
			? '<button class="btn primary" id="learnQuiz">测这一章</button>'
			: '<button class="btn" disabled>附录不参与自测</button>';

		app.innerHTML = '<div class="layout">'
			+ '<aside class="panel toc">' + toc + '</aside>'
			+ '<article class="panel reader"><h1>' + esc(chapter.title) + '</h1>'
			+ '<p class="lede">自编讲义，按知识模块整理，不是教材原文；教材章节号待校对。</p>'
			+ body
			+ '<div class="chapter-actions">' + quizButton
			+ '<button class="btn ghost" id="learnWrong">看错题本</button></div>'
			+ '</article></div>';

		app.querySelectorAll(".toc-item").forEach(function (button) {
			button.addEventListener("click", function () {
				state.chapterId = button.getAttribute("data-chapter");
				renderLearn();
				window.scrollTo({ top: 0, behavior: "smooth" });
			});
		});
		document.getElementById("learnWrong").addEventListener("click", function () { setTab("wrong"); });
		var quizButtonNode = document.getElementById("learnQuiz");
		if (quizButtonNode !== null) {
			quizButtonNode.addEventListener("click", function () {
				state.quizChapter = chapter.id;
				setTab("quiz");
			});
		}
	}

	/* ---------- 自测 ---------- */

	function renderQuizTab() {
		if (state.quiz !== null) {
			if (state.quiz.done) renderResult();
			else renderQuestion();
			return;
		}
		if (ITEMS.length === 0) {
			app.innerHTML = '<div class="panel empty"><h2>题库还没生成</h2>'
				+ '<p>在技能目录运行下面的命令，然后刷新页面。</p>'
				+ '<code>node scripts/dlquiz.js --build</code></div>';
			return;
		}

		var chapterOptions = [{ id: "all", title: "全部章节", module: "" }].concat(CHAPTERS.filter(function (item) { return item.module; }));
		var chips = chapterOptions.map(function (item) {
			return '<button class="chip' + (item.id === state.quizChapter ? " active" : "") + '" data-chapter="' + item.id + '">'
				+ esc(item.title) + '</button>';
		}).join("");

		var pool = poolFor(state.quizChapter);
		app.innerHTML = '<div class="panel setup">'
			+ '<h2>开始自测</h2>'
			+ '<p class="hint">先选章节，再选玩法。题目全部来自题库，计算题的答案由脚本复核过，不会临场编题。</p>'
			+ '<div class="field"><label>选章节</label><div class="chips">' + chips + '</div></div>'
			+ '<div class="field"><label>选玩法</label><div class="chips">'
			+ '<button class="chip' + (state.quizMode === "solo" ? " active" : "") + '" data-mode="solo">单人闯关</button>'
			+ '<button class="chip' + (state.quizMode === "versus" ? " active" : "") + '" data-mode="versus">人机对战</button>'
			+ '</div></div>'
			+ '<div class="field"><label>题数（这一章共有 ' + pool.length + ' 题）</label><div class="chips">'
			+ [5, 10, 20].map(function (count) {
				var disabled = pool.length < count ? " disabled" : "";
				return '<button class="chip" data-count="' + count + '"' + disabled + '>' + count + ' 题</button>';
			}).join("")
			+ '</div></div>'
			+ '<button class="btn primary" id="startQuiz">开始</button>'
			+ '</div>';

		app.querySelectorAll("[data-chapter]").forEach(function (button) {
			button.addEventListener("click", function () {
				state.quizChapter = button.getAttribute("data-chapter");
				renderQuizTab();
			});
		});
		app.querySelectorAll("[data-mode]").forEach(function (button) {
			button.addEventListener("click", function () {
				state.quizMode = button.getAttribute("data-mode");
				renderQuizTab();
			});
		});
		app.querySelectorAll("[data-count]").forEach(function (button) {
			button.addEventListener("click", function () {
				if (button.disabled) return;
				startQuiz(Number(button.getAttribute("data-count")));
			});
		});
		document.getElementById("startQuiz").addEventListener("click", function () {
			startQuiz(Math.min(10, pool.length));
		});
	}

	function startQuiz(count, customItems) {
		stopTimers();
		var pool = customItems !== undefined ? customItems : poolFor(state.quizChapter);
		var questions = customItems !== undefined ? pool.slice() : shuffle(pool).slice(0, count);
		state.quiz = {
			mode: state.quizMode,
			questions: questions,
			index: 0,
			score: 0,
			streak: 0,
			best: 0,
			answers: [],
			locked: false,
			aiScore: 0,
			done: false,
			startedAt: Date.now()
		};
		renderQuestion();
	}

	function currentQuestion() {
		return state.quiz.questions[state.quiz.index];
	}

	function renderQuestion() {
		var quiz = state.quiz;
		var question = currentQuestion();
		if (question === undefined) { finishQuiz(); return; }
		quiz.locked = false;

		var options = question.options.map(function (text, index) {
			return '<button class="option" data-index="' + index + '">'
				+ '<span class="key">' + "ABCD"[index] + '</span>'
				+ '<span>' + esc(text) + '</span></button>';
		}).join("");

		var stars = "★".repeat(question.difficulty) + "☆".repeat(3 - question.difficulty);
		var aiPanel = quiz.mode === "versus"
			? '<div class="ai"><div class="avatar">AI</div><div class="bar"><i id="aibar"></i></div>'
				+ '<div class="state" id="aistate">思考中…</div><div class="state">AI <b>' + quiz.aiScore + '</b></div></div>'
			: "";

		app.innerHTML = '<div class="topbar">'
			+ '<span class="chip active">' + (quiz.mode === "versus" ? "人机对战" : "单人闯关") + '</span>'
			+ '<div class="stats"><div>第 <b>' + (quiz.index + 1) + '</b> / ' + quiz.questions.length + '</div>'
			+ '<div class="score">得分 <b id="score">' + quiz.score + '</b></div>'
			+ '<div>连对 <b>' + quiz.streak + '</b></div></div></div>'
			+ aiPanel
			+ '<div class="panel card">'
			+ '<div class="qhead"><span class="tag">' + (MODULES[question.module] || question.module) + '</span>'
			+ '<span class="stars">' + stars + '</span></div>'
			+ '<p class="stem">' + esc(question.stem) + '</p>'
			+ '<div class="options">' + options + '</div><div id="feedback"></div></div>';

		app.querySelectorAll(".option").forEach(function (button) {
			button.addEventListener("click", function () { answer(Number(button.getAttribute("data-index")), "player"); });
		});
		if (quiz.mode === "versus") scheduleAI(question);
	}

	function scheduleAI(question) {
		clearTimeout(aiTimer);
		var delay = 1700 + Math.random() * 2400 - question.difficulty * 260;
		var startedAt = Date.now();
		var interval = setInterval(function () {
			var bar = document.getElementById("aibar");
			if (bar === null || !document.body.contains(bar)) { clearInterval(interval); return; }
			bar.style.width = (Math.min(1, (Date.now() - startedAt) / delay) * 100).toFixed(0) + "%";
		}, 60);
		aiTimer = setTimeout(function () {
			clearInterval(interval);
			var quiz = state.quiz;
			if (quiz === null || quiz.locked) return;
			var accuracy = 0.82 - question.difficulty * 0.07;
			var correct = Math.random() < accuracy;
			var label = document.getElementById("aistate");
			if (label !== null) label.textContent = correct ? "已抢答" : "答错了";
			var chosen = correct ? question.answer : (question.answer + 1 + Math.floor(Math.random() * 3)) % 4;
			reveal(chosen, correct);
			if (correct) quiz.aiScore += 100;
			quiz.locked = true;
			showFeedback(correct, "AI 抢先答" + (correct ? "对了" : "错了") + "，这题归它。", false);
		}, delay);
	}

	function answer(index) {
		var quiz = state.quiz;
		if (quiz === null || quiz.locked) return;
		var question = currentQuestion();
		var correct = index === question.answer;
		quiz.locked = true;
		clearTimeout(aiTimer);
		reveal(index, correct);

		if (correct) {
			var bonus = Math.min(50, quiz.streak * 15);
			quiz.score += 100 + bonus;
			quiz.streak += 1;
			quiz.best = Math.max(quiz.best, quiz.streak);
			showFeedback(true, "答对了，+" + (100 + bonus) + " 分" + (bonus > 0 ? "（连对加成 " + bonus + "）" : "") + "。", false);
		} else {
			quiz.streak = 0;
			quiz.score = Math.max(0, quiz.score - 20);
			recordWrong(question, index);
			updateBadge();
			showFeedback(false, "答错了，扣 20 分。", true);
		}

		quiz.answers.push({ question: question, chosen: index, correct: correct });
		var score = document.getElementById("score");
		if (score !== null) {
			score.textContent = quiz.score;
			score.classList.remove("pop");
			void score.offsetWidth;
			score.classList.add("pop");
		}
	}

	function reveal(chosen, correct) {
		var question = currentQuestion();
		app.querySelectorAll(".option").forEach(function (button, index) {
			button.disabled = true;
			if (index === question.answer) button.classList.add("correct");
			if (index === chosen && !correct) button.classList.add("wrong");
		});
	}

	function showFeedback(correct, prefix, saved) {
		var quiz = state.quiz;
		var question = currentQuestion();
		var box = document.getElementById("feedback");
		if (box === null) return;
		var last = quiz.index === quiz.questions.length - 1;
		box.innerHTML = '<div class="feedback ' + (correct ? "ok" : "bad") + '">'
			+ '<div class="verdict">' + prefix + '</div>'
			+ '<div>' + esc(question.explain) + '</div>'
			+ (saved ? '<div class="save">已记入错题本</div>' : '')
			+ '</div><div class="actions"><button class="btn primary" id="next">'
			+ (last ? "看成绩" : "下一题") + '</button></div>';
		var next = document.getElementById("next");
		next.addEventListener("click", nextQuestion);
		next.focus();
	}

	function nextQuestion() {
		var quiz = state.quiz;
		if (quiz === null) return;
		quiz.index += 1;
		if (quiz.index >= quiz.questions.length) finishQuiz();
		else renderQuestion();
	}

	function finishQuiz() {
		stopTimers();
		state.quiz.done = true;
		renderResult();
	}

	function renderResult() {
		var quiz = state.quiz;
		var answered = quiz.answers.length;
		var right = quiz.answers.filter(function (item) { return item.correct; }).length;
		var accuracy = answered === 0 ? 0 : Math.round((right / answered) * 100);
		var seconds = Math.round((Date.now() - quiz.startedAt) / 1000);
		var wrong = quiz.answers.filter(function (item) { return !item.correct; });

		var review = wrong.length === 0
			? '<p class="result-sub">这局没有错题。</p>'
			: '<h2 class="section-title">这局的错题</h2><div class="review">' + wrong.map(function (item) {
				return '<div class="item"><b>' + esc(item.question.stem) + '</b><br>'
					+ '正确答案：<span class="right">' + esc(item.question.options[item.question.answer]) + '</span><br>'
					+ esc(item.question.explain) + '</div>';
			}).join("") + '</div>';

		app.innerHTML = '<div class="topbar"><span class="chip active">已完成</span>'
			+ '<div class="stats"><div>用时 <b>' + seconds + 's</b></div></div></div>'
			+ '<div class="panel card"><div class="result-score">' + quiz.score + '</div>'
			+ '<div class="result-sub">答对 ' + right + ' / ' + answered + '，正确率 ' + accuracy + '%，最长连对 ' + quiz.best
			+ (quiz.mode === "versus" ? '；AI 得分 ' + quiz.aiScore : '') + '</div>'
			+ review
			+ '<div class="actions"><button class="btn" id="backSetup">换一章</button>'
			+ '<button class="btn primary" id="again">再测一次</button></div></div>';

		document.getElementById("backSetup").addEventListener("click", function () { state.quiz = null; renderQuizTab(); });
		document.getElementById("again").addEventListener("click", function () {
			var count = quiz.questions.length;
			state.quiz = null;
			startQuiz(count);
		});
	}

	/* ---------- 错题本 ---------- */

	function renderWrong() {
		var list = loadWrong();
		if (list.length === 0) {
			app.innerHTML = '<div class="panel empty"><h2>错题本是空的</h2>'
				+ '<p>先去自测，答错的题会自动收进来。</p>'
				+ '<button class="btn primary" id="goQuiz">去自测</button></div>';
			document.getElementById("goQuiz").addEventListener("click", function () { setTab("quiz"); });
			return;
		}

		var cards = list.map(function (entry) {
			return '<div class="wrong-card"><p class="q">' + esc(entry.stem) + '</p>'
				+ '<div class="line">你选的：<span class="yours">' + esc(entry.options[entry.chosen]) + '</span></div>'
				+ '<div class="line">正确答案：<span class="right">' + esc(entry.options[entry.answer]) + '</span></div>'
				+ '<div class="line">' + esc(entry.explain) + '</div>'
				+ '<div class="foot"><span class="count">错 ' + entry.count + ' 次 · ' + (MODULES[entry.module] || entry.module) + '</span>'
				+ '<button class="btn ghost" data-remove="' + entry.id + '">移除</button></div></div>';
		}).join("");

		app.innerHTML = '<div class="wrong-head">'
			+ '<div><h2 style="margin:0 0 4px;font-size:17px;">错题本</h2>'
			+ '<p class="sub" style="margin:0;">共 ' + list.length + ' 题，保存在本机浏览器里</p></div>'
			+ '<div class="actions" style="margin:0;">'
			+ '<button class="btn" id="clearWrong">清空</button>'
			+ '<button class="btn primary" id="redoWrong">重做这些题</button></div></div>'
			+ '<div class="wrong-list">' + cards + '</div>';

		document.getElementById("clearWrong").addEventListener("click", function () {
			if (!window.confirm("清空后错题记录找不回来，确定吗？")) return;
			saveWrong([]);
			renderWrong();
			updateBadge();
		});
		document.getElementById("redoWrong").addEventListener("click", function () {
			var items = list.map(function (entry) {
				return {
					id: entry.id,
					module: entry.module,
					type: "review",
					difficulty: 2,
					stem: entry.stem,
					options: entry.options,
					answer: entry.answer,
					explain: entry.explain
				};
			});
			state.quizChapter = "all";
			state.quizMode = "solo";
			setTab("quiz");
			startQuiz(items.length, items);
		});
		app.querySelectorAll("[data-remove]").forEach(function (button) {
			button.addEventListener("click", function () {
				removeWrong(button.getAttribute("data-remove"));
				renderWrong();
				updateBadge();
			});
		});
	}

	function stopTimers() {
		if (clock !== null) { clearInterval(clock); clock = null; }
		clearTimeout(aiTimer);
	}

	/* ---------- 事件与启动 ---------- */

	document.querySelectorAll(".tab").forEach(function (button) {
		button.addEventListener("click", function () { setTab(button.getAttribute("data-tab")); });
	});

	document.addEventListener("keydown", function (event) {
		if (state.tab !== "quiz" || state.quiz === null || state.quiz.done) return;
		if (event.key >= "1" && event.key <= "4" && !state.quiz.locked) {
			answer(Number(event.key) - 1);
			return;
		}
		if (event.key === "Enter") {
			var next = document.getElementById("next");
			if (next !== null) { event.preventDefault(); next.click(); }
		}
	});

	updateBadge();
	render();
})();
</script>
</body>
</html>
